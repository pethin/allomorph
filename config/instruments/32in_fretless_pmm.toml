# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 32" Medium Scale Fretless Bass with Reverse EMG PCSX and EMG MMTWX (ABCX Active Blend)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 32.0" (812.8mm total, 406.4mm 12th fret mark to bridge saddle)
#   - Reverse EMG PCSX Split: Centerline 266.0mm from 12th fret = 140.4mm from bridge saddle
#       - D/G half (forward towards neck): 154.4mm from bridge (252.0mm from 12th fret)
#       - E/A half (rearward towards bridge): 126.4mm from bridge (280.0mm from 12th fret)
#   - EMG MMTWX: 62.2mm centerline (Neck coil @ 73.7mm, Bridge coil @ 50.8mm)
# Electronics:
#   - Active 18V EMG ABCX active blend control (op-amp buffered parallel summing).
#   - MMTWX push/pull on volume pot toggles between single-coil (J mode @ 50.8mm, pushed down) and dual-coil (MM mode, pulled up).

id = "32in_fretless_pmm"
name = "32\" Fretless Custom (EMG PCSX + MMTWX)"
scale_length_in = 32.0
scale_length_m = 0.8128
electronics = "active"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [66.98, 89.41, 119.35, 159.31]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with La Bella Low Tension Flats (LTF-4A): smooth stainless flat ribbon
# wound over flexible round core. Lower tension (~132 lbs) and early viscoelastic
# damping deliver woody upright-like thump and fingerboard mwah.
[strings]
preset = "flatwound_low_tension"
brand = "La Bella"
model = "LTF-4A"
gauge = "43-100"
core = "round"
wrap = "stainless_flat"
tension_lbs = 132.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

# Reverse EMG PCSX Split-Coil:
# Centerline located exactly 266.0mm from 12th fret mark (140.4mm from bridge).
[pickups.pcsx]
name = "Reverse EMG PCSX Split-Coil (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1404  # 140.4mm centerline (266.0mm from 12th fret)
aperture_width_in = 1.10         # 1.10" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "ceramic_steel"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 2000.0
coils = [
    # Strings 1 & 2 see forward coil half (closer to neck for warm acoustic bloom)
    { id = "forward", strings = [1, 2], position_from_bridge_m = 0.1544, aperture_width_in = 0.45, weight = 1.0, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 4.65e-9 },
    # Strings 3 & 4 see rearward coil half (closer to bridge for tight fundamental definition)
    { id = "rearward", strings = [3, 4], position_from_bridge_m = 0.1264, aperture_width_in = 0.45, weight = 1.0, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 4.65e-9 },
]

# EMG MMTWX Active Dual-Mode Pickup (Bridge):
[pickups.mmtwx]
name = "EMG MMTWX Active Dual-Mode Pickup"
position_name = "Bridge"
position_from_bridge_m = 0.0622  # 62.2mm centerline (2.45")
aperture_width_in = 1.50         # Dual-coil housing aperture
coil_spacing_in = 0.90           # 0.90" (22.86mm) spacing between coil centers
type = "dual_coil_parallel"
magnet_type = "ceramic_steel"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 2000.0
coils = [
    { id = "neck", strings = ["all"], position_from_bridge_m = 0.0737, aperture_width_in = 0.45, weight = 0.5, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 2.4e-9 },
    { id = "bridge", strings = ["all"], position_from_bridge_m = 0.0508, aperture_width_in = 0.45, weight = 0.5, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 2.4e-9 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (EMG ABCX Active Blend & Push-Pull Coil Switch)
# ------------------------------------------------------------------------------

[harnesses.active]
name = "EMG ABCX Active Blend Harness with MMTWX Push-Pull"
type = "active_preamp"
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    # PCSX pickup into blend neck_in
    ["pickups.pcsx.hot", "controls.blend.neck_in"],
    ["pickups.pcsx.cold", "GND"],

    # Blend output into master volume
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 25000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.switches.coil_mode]
name = "MMTWX Push-Pull Coil Mode"
type = "push_pull"
default = "dual"

[harnesses.active.switches.coil_mode.positions.dual]
connect = [
    ["pickups.mmtwx.neck.hot", "controls.blend.bridge_in"],
    ["pickups.mmtwx.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.mmtwx.neck.cold", "GND"],
    ["pickups.mmtwx.bridge.cold", "GND"],
]
k_mutual = 0.20
components = { "pickups.mmtwx.neck.Ccoil" = 4.86e-9, "pickups.mmtwx.bridge.Ccoil" = 4.86e-9 }

[harnesses.active.switches.coil_mode.positions.single]
connect = [
    ["pickups.mmtwx.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.mmtwx.bridge.cold", "GND"],
    ["pickups.mmtwx.neck.cold", "GND"],
]
k_mutual = 0.0
components = { "pickups.mmtwx.bridge.Ccoil" = 2.68e-9 }

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.fretless_blend]
version = 1
name = "Fretless PCSX + MMTWX Parallel Blend"
tone_name = "Fretless P∕MM"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0, blend = 0.5 }

[voicings.pcsx_solo]
version = 1
name = "Solo Fretless PCSX Warm Mwah"
tone_name = "Fretless P Solo"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0, blend = 0.0 }

[voicings.jaco_growl]
version = 1
name = "Solo Bridge MMTWX Single Singing Growl"
tone_name = "Fretless J Growl"
harness = "active"
switches = { coil_mode = "single" }
controls = { vol = 1.0, blend = 1.0 }

[voicings.pj_blend]
version = 1
name = "Fretless PCSX + Single J Blend"
tone_name = "Fretless PJ Blend"
harness = "active"
switches = { coil_mode = "single" }
controls = { vol = 1.0, blend = 0.5 }
