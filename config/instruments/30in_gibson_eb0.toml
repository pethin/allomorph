# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 30.5" Gibson EB-0 Mudbucker (Solid Mahogany Body)
# ==============================================================================

id = "30in_gibson_eb0"
name = "30.5\" Gibson EB-0 Mudbucker"
scale_length_in = 30.5
scale_length_m = 0.7747
electronics = "passive"
version = 1

string_wave_speeds = [63.83, 85.22, 113.75, 151.84]

[strings]
preset = "flatwound_vintage_heavy"
brand = "Gibson"
model = "Vintage Flatwound"
gauge = "50-105"
core = "round"
wrap = "monel_flat"
tension_lbs = 152.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCER (Gibson 30k Sidewinder Neck Humbucker)
# ------------------------------------------------------------------------------

[pickups.mudbucker]
name = "Gibson 30k Sidewinder Neck Humbucker (Mudbucker)"
position_name = "Neck"
position_from_bridge_m = 0.2668  # Neck heel datum (266.8mm)
aperture_width_in = 1.25
coil_spacing_in = 0.0
type = "sidewinder"
magnet_type = "ceramic"
coils = [
    { id = "sidewinder", strings = ["all"], position_from_bridge_m = 0.2668, aperture_width_in = 1.25, pole_type = "rod", L = 14.4, Rdc = 27900.0, Reddy = 450000.0, Ccoil = 8e-11, weight = 1.0 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESSES (Multi-Harness: 1960s EB-0 1V/1T and 1961 EB-2/EB-3 Baritone)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "EB-0 500k 1V/1T Passive Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0

wiring = [
    ["pickups.mudbucker.sidewinder.cold", "GND"],
    ["pickups.mudbucker.sidewinder.hot", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
    ["controls.vol.in", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
]

[harnesses.passive.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 500000.0
default = 1.0

[harnesses.passive.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 500000.0
cap = 2.2e-8
default = 1.0

[harnesses.baritone]
name = "EB-2 / EB-3 CPA-657 Baritone Choke Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0

wiring = [
    ["pickups.mudbucker.sidewinder.cold", "GND"],
    ["pickups.mudbucker.sidewinder.hot", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.baritone.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 500000.0
default = 1.0

[harnesses.baritone.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 250000.0
cap = 4.7e-8
default = 1.0

[harnesses.baritone.switches.mode]
name = "Baritone Choke Switch"
type = "toggle"
default = "baritone"

[harnesses.baritone.switches.mode.positions.deep]
connect = [
    ["pickups.mudbucker.sidewinder.hot", "controls.vol.in"],
]

[harnesses.baritone.switches.mode.positions.baritone]
connect = [
    ["pickups.mudbucker.sidewinder.hot", "baritone_cap.in"],
    ["baritone_cap.out", "controls.vol.in"],
    ["pickups.mudbucker.sidewinder.hot", "baritone_res.in"],
    ["baritone_res.out", "controls.vol.in"],
    ["baritone_choke.in", "controls.vol.in"],
    ["baritone_choke.out", "GND"],
]
components = { "baritone_cap" = 2.0e-8, "baritone_res" = 220000.0, "baritone_choke" = 15.0, "baritone_choke.Rdc" = 650.0 }

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.neck_deep]
version = 1
name = "Massive 14.4H Sidewinder Sub-Bass"
tone_name = "Mudbucker Deep"
harness = "passive"
controls = { vol = 1.0, tone = 1.0 }

[voicings.neck_baritone]
version = 1
name = "EB-2 / EB-3 Baritone Choke Mid-Bark"
tone_name = "Mudbucker Baritone"
harness = "baritone"
switches = { mode = "baritone" }
controls = { vol = 1.0, tone = 1.0 }
