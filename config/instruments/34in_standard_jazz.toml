# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Jazz Bass (Neck + Bridge Single Coils)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - 60s/Modern Neck Single-Coil: 155.6mm from bridge saddle (276.2mm from 12th fret, 10 7/8")
#   - 60s/Modern Bridge Single-Coil: 63.5mm from bridge saddle (368.3mm from 12th fret, 14 1/2")
#   - Pickup Spacing: 92.1mm (3 5/8" center-to-center)
#   - Coil Aperture: 0.45" (11.4mm) single-coil magnetic sensing aperture over 3/16" Alnico V rods

id = "34in_standard_jazz"
name = "34\" Standard Jazz Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.neck]
name = "Jazz Neck Single-Coil"
position_name = "Neck"
position_from_bridge_m = 0.1556  # 155.6mm from bridge (10 7/8" from 12th fret)
aperture_width_in = 0.45         # 0.45" narrow single-coil sensing aperture
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
coils = [
    { id = "neck", position_from_bridge_m = 0.1556, aperture_width_in = 0.45, pole_type = "rod", L = 3.2, Rdc = 7200.0, Reddy = 135000.0, Ccoil = 7.0e-11, weight = 1.0 },
]

[pickups.bridge]
name = "60s Jazz Bridge Single-Coil"
position_name = "Bridge"
position_from_bridge_m = 0.0635  # 63.5mm from bridge (14 1/2" from 12th fret)
aperture_width_in = 0.45         # 0.45" narrow single-coil sensing aperture
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
coils = [
    { id = "bridge", position_from_bridge_m = 0.0635, aperture_width_in = 0.45, pole_type = "rod", L = 3.6, Rdc = 7800.0, Reddy = 125000.0, Ccoil = 7.0e-11, weight = 1.0 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESSES (Multi-Harness: Authentic 2V/1T Passive and Active 2-Band)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "Jazz Bass 2V/1T Passive Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0
k_mutual = 0.04

wiring = [
    ["pickups.neck.hot", "controls.neck_vol.wiper"],
    ["controls.neck_vol.in", "bus"],
    ["controls.neck_vol.gnd", "GND"],
    ["pickups.neck.cold", "GND"],

    ["pickups.bridge.hot", "controls.bridge_vol.wiper"],
    ["controls.bridge_vol.in", "bus"],
    ["controls.bridge_vol.gnd", "GND"],
    ["pickups.bridge.cold", "GND"],

    ["bus", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
    ["bus", "out"],
]

[harnesses.passive.controls.neck_vol]
name = "Neck Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.bridge_vol]
name = "Bridge Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 250000.0
cap = 4.7e-8
default = 1.0

[harnesses.active]
name = "Sadowsky 2-Band Active Preamp"
type = "active_preamp"
preamp = "sadowsky_2band"
load_resistance = 1000000.0
cable_pf = 30.0
k_mutual = 0.04

wiring = [
    ["pickups.neck.hot", "controls.blend.neck_in"],
    ["pickups.neck.cold", "GND"],
    ["pickups.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.bridge.cold", "GND"],
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 250000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.controls.bass]
name = "Bass Boost"
type = "preamp_band"
band = "bass"
default = 0.5

[harnesses.active.controls.treble]
name = "Treble Boost"
type = "preamp_band"
band = "treble"
default = 0.5

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_open]
version = 1
name = "60s Jazz Pair Wide-Open"
tone_name = "Jazz Pair Open"
harness = "passive"
controls = { neck_vol = 1.0, bridge_vol = 1.0, tone = 1.0 }

[voicings.pair_mids]
version = 1
name = "60s Jazz Pair Vocal Mids"
tone_name = "Jazz Pair Mids"
harness = "passive"
controls = { neck_vol = 1.0, bridge_vol = 1.0, tone = 0.0 }
components = { "controls.tone.cap" = 2.2e-8 }

[voicings.bridge_growl]
version = 1
name = "60s Jazz Bridge Growl"
tone_name = "Jazz Bridge Growl"
harness = "passive"
controls = { neck_vol = 0.75, bridge_vol = 1.0, tone = 1.0 }

[voicings.bridge_open]
version = 1
name = "60s Jazz Bridge Open"
tone_name = "Jazz Bridge Open"
harness = "passive"
controls = { neck_vol = 0.0, bridge_vol = 1.0, tone = 1.0 }

[voicings.neck_warm]
version = 1
name = "60s Jazz Neck Warm"
tone_name = "Jazz Neck Warm"
harness = "passive"
controls = { neck_vol = 1.0, bridge_vol = 0.0, tone = 1.0 }

[voicings.pair_active]
version = 1
name = "Modern Sadowsky Active Jazz Pair"
tone_name = "Jazz Pair Active"
harness = "active"
controls = { vol = 1.0, blend = 0.5, bass = 0.5, treble = 0.5 }
