# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Jazz Bass (Neck + Bridge Single Coils)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - 60s/Modern Neck Single-Coil: 155.6mm from bridge saddle (276.2mm from 12th fret, 10 7/8")
#   - 60s/Modern Bridge Single-Coil: 63.5mm from bridge saddle (368.3mm from 12th fret, 14 1/2")
#   - Pickup Spacing: 92.1mm (3 5/8" center-to-center)
#   - Coil Aperture: 0.75" (19.05mm) narrow single-coil magnetic sensing envelope
# Electronics:
#   - Passive high-impedance circuit: Dual 250k volume pots (V/V/T), 250k master tone (47nF cap).
#   - Parallel summing loaded resonance: 3.90 kHz, Q = 1.30.
#   - Solo Neck loaded resonance: 3.60 kHz, Q = 1.50.
#   - Solo Bridge loaded resonance: 3.20 kHz, Q = 1.60.

id = "34in_standard_jazz"
name = "34\" Standard Jazz Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard nickel roundwounds (D'Addario EXL165 / Fender 7250M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. JAZZ NECK SINGLE-COIL (Solo Neck)
# ------------------------------------------------------------------------------
[pickups.neck]
name = "Jazz Neck Single-Coil"
position_name = "Neck"
position_from_bridge_m = 0.1556  # 155.6mm from bridge (10 7/8" from 12th fret)
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
resonant_frequency_hz = 3600.0   # Neck single-coil loaded resonance (3.6 kHz)
q_factor = 1.50
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. 60s JAZZ BRIDGE SINGLE-COIL (Solo Bridge)
# ------------------------------------------------------------------------------

[pickups.neck.circuit]
topology = "single"
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.bridge]
name = "60s Jazz Bridge Single-Coil"
position_name = "Bridge"
position_from_bridge_m = 0.0635  # 63.5mm from bridge (14 1/2" from 12th fret)
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
resonant_frequency_hz = 3200.0   # Bridge single-coil loaded resonance (3.2 kHz)
q_factor = 1.60
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. JAZZ NECK + BRIDGE PARALLEL (Both Volumes 100%)
# ------------------------------------------------------------------------------

[pickups.bridge.circuit]
topology = "single"
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.pair_parallel]
name = "Jazz Neck + Bridge Parallel"
position_name = "Parallel"
position_from_bridge_m = 0.1095  # Acoustic centroid
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "composite"
magnet_type = "alnico_v"
resonant_frequency_hz = 3900.0   # Combined parallel equivalent resonance (3.9 kHz)
q_factor = 1.30
components = [
    { pickup = "neck", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest physical pickup state on the Jazz Bass:
#   - Neck Solo: P-Bass styles, Mudbucker, and Upright acoustic fullness
#   - Bridge Solo: 60s Bridge growl, StingRay bite, and Rickenbacker clank
#   - Both Parallel: Classic dual-single scooped slap and modern hybrid tones


[pickups.pair_parallel.circuit]
topology = "parallel"
Rtop = 10.0
Rbot = 125000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.pair_parallel.circuit.neck]
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11

[pickups.pair_parallel.circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11

[pickups.neck_active]
name = "Modern Active Jazz Single-Coil (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1556
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.25
resonant_frequency_hz = 5200.0
q_factor = 1.70
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 1.0 }
]

[pickups.neck_active.circuit]
topology = "single"
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11
vsat = 0.4
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[pickups.bridge_active]
name = "Modern Active Jazz Single-Coil (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0635
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.28
resonant_frequency_hz = 4600.0
q_factor = 1.80
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]

[pickups.bridge_active.circuit]
topology = "single"
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[pickups.pair_active]
name = "Modern Active Jazz Pair (Neck + Bridge)"
position_name = "Parallel"
position_from_bridge_m = 0.1095
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "composite"
magnet_type = "alnico_v"
resonant_frequency_hz = 4800.0
q_factor = 1.60
components = [
    { pickup = "neck_active", weight = 0.5 },
    { pickup = "bridge_active", weight = 0.5 }
]

[pickups.pair_active.circuit]
topology = "parallel"
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[pickups.pair_active.circuit.neck]
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11
vsat = 0.4

[pickups.pair_active.circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6

[pickups.pair_jaco_growl]
name = "Jazz Jaco Bridge Growl Bias (Neck 75%, Bridge 100%)"
position_name = "Bridge"
position_from_bridge_m = 0.0957
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "composite"
magnet_type = "alnico_v"
resonant_frequency_hz = 3400.0
q_factor = 1.50
components = [
    { pickup = "neck", weight = 0.35 },
    { pickup = "bridge", weight = 0.65 }
]

[pickups.pair_jaco_growl.circuit]
topology = "parallel"
Rtop = 10.0
Rbot = 109000.0
Rtone = 250000.0
Ctone = 4.7e-08
Rpot_n = 55000.0
Rpot_b = 0.0

[pickups.pair_jaco_growl.circuit.neck]
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11
vsat = 0.4

[pickups.pair_jaco_growl.circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6

# ------------------------------------------------------------------------------
# 2. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_open]
version = 1
name = "60s Dual Single-Coils Open"
tone_name = "Jazz Pair Open"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 4.7e-08
gain_db = -0.5

[voicings.pair_mids]
version = 1
name = "60s Dual Single-Coils Vocal Mids"
tone_name = "Jazz Pair Mids"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 2.2e-08
Rtone = 3.3
gain_db = -0.5

[voicings.pair_active]
version = 1
name = "Modern Active 2-Band Slap Scoop"
tone_name = "Jazz Pair Active"
pickup = "pair_active"
affinity = "parallel"
vol_pos = 1.0
tone_pos = 1.0
gain_db = 1.0
preamp_preset = "sadowsky_2band"

[voicings.bridge_growl]
version = 1
name = "Singing Jaco Bridge Growl"
tone_name = "Jazz Bridge Growl"
pickup = "pair_jaco_growl"
affinity = "bridge"
vol_pos = 1.0
gain_db = -1.2

[voicings.bridge_open]
version = 1
name = "60s Solo Bridge Single-Coil Open"
tone_name = "Jazz Bridge Open"
pickup = "bridge"
affinity = "bridge"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 4.7e-08

[voicings.neck_warm]
version = 1
name = "60s Solo Neck Single-Coil Warm"
tone_name = "Jazz Neck Warm"
pickup = "neck"
affinity = "neck"
vol_pos = 1.0
tone_pos = 0.7
tone_cap_f = 4.7e-08

# ------------------------------------------------------------------------------
# 3. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "neck"
bridge = "bridge"
parallel = "pair_parallel"
direct = "pair_parallel"
jazz_pair_active = "pair_active"
"34in_standard_jazz:pair_active" = "pair_active"
