# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Preamp Soapbar Bass (Ibanez SR / Yamaha TRBX / Sire F10 / Cort)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Modern Neck Soapbar: Centerline 135.0mm from bridge saddle (296.8mm from 12th fret)
#       - Dual round pole coils: forward coil 143.25mm, rearward coil 126.75mm (spacing d = 0.65" / 16.51mm)
#       - Cylindrical rod aperture width: 0.65" (16.51mm) per coil
#   - Modern Bridge Soapbar: Centerline 55.0mm from bridge saddle (376.8mm from 12th fret)
#       - Dual round pole coils: forward coil 63.25mm, rearward coil 46.75mm (spacing d = 0.65" / 16.51mm)
#       - Cylindrical rod aperture width: 0.65" (16.51mm) per coil
# Electronics:
#   - Dual passive Alnico V dual-coil soapbars with exposed cylindrical round pole pieces
#     (Nordstrand Big Break/Single, Yamaha YGD H5, Sire Marcus Miller Pure-H, Ibanez PowerSpan).
#   - 10 exposed cylindrical Alnico V round pole pieces (dual rows of 5 straddling B, E, A, D, G strings).
#   - Also optimal for dual-humbucker active basses (Sterling Ray34HH/Ray35HH / Music Man StingRay HH).
#   - 2D cylindrical pole Bessel aperture integration (J1(k*rp) / (k*rp)).
#   - Onboard active 9V/18V 3-band preamp buffer (Ibanez Custom / Yamaha / Sire Heritage-3 / Cort).
#   - Active buffer provides high input impedance (1.0 MΩ), completely isolating passive coils from cable capacitance.
#   - Set to center detents (flat 0 dB EQ response, finite DC transmission H(0) >= 1.0).
#   - Low output impedance (< 100 Ω) direct to output jack / Anagram Block 1.
# Circuit Parameters:
#   - Neck Soapbar: L = 3.8H, Rdc = 8.6kΩ, Reddy = 95kΩ, Ccoil = 95pF (loaded fr = 3.80 kHz, Q = 1.45).
#   - Bridge Soapbar: L = 4.2H, Rdc = 9.4kΩ, Reddy = 90kΩ, Ccoil = 95pF (loaded fr = 4.10 kHz, Q = 1.40).
#   - Parallel center blend: 500k volume/blend pot, loaded fr = 3.95 kHz, Q = 1.35.

id = "34in_preamp_soapbar"
name = "34\" Preamp Soapbar Bass (Dual Humbuckers)"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"
version = 1

# Extended wave speeds: v = 2 * L * f0 (spans B0=30.87Hz to G2=98.00Hz for 4, 5, and 6-string universal compatibility)
string_wave_speeds = [53.31, 71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard 5-string nickel roundwounds (D'Addario EXL170-5 .045-.130).
[strings]
preset = "roundwound_nickel_5string"
brand = "D'Addario"
model = "EXL170-5"
gauge = "45-130"
core = "hex"
wrap = "nickel_round"
tension_lbs = 195.0

# ------------------------------------------------------------------------------
# 1. PASSIVE SOAPBAR + ACTIVE PREAMP (Neck Solo)
# ------------------------------------------------------------------------------
[pickups.neck]
name = "Passive Soapbar with Preamp (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1350  # 135.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-coil soapbar housing
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-coil spacing
type = "dual_coil_parallel"
magnet_type = "alnico_v"
pole_type = "rod"
resonant_frequency_hz = 3800.0   # Active buffered loaded resonance
q_factor = 1.45
coils = [
    { strings = ["all"], position_from_bridge_m = 0.14325, aperture_width_in = 0.65, weight = 0.5, pole_type = "rod" },
    { strings = ["all"], position_from_bridge_m = 0.12675, aperture_width_in = 0.65, weight = 0.5, pole_type = "rod" }
]

[pickups.neck.circuit]
topology = "single"
L = 3.8
Rdc = 8600.0
Reddy = 95000.0
Ccoil = 9.5e-11
active = true
preamp = "none"
Rvol = 500000.0

# ------------------------------------------------------------------------------
# 2. PASSIVE SOAPBAR + ACTIVE PREAMP (Bridge Solo)
# ------------------------------------------------------------------------------
[pickups.bridge]
name = "Passive Soapbar with Preamp (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0550  # 55.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-coil soapbar housing
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-coil spacing
type = "dual_coil_parallel"
magnet_type = "alnico_v"
pole_type = "rod"
resonant_frequency_hz = 4100.0   # Active buffered loaded resonance
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.06325, aperture_width_in = 0.65, weight = 0.5, pole_type = "rod" },
    { strings = ["all"], position_from_bridge_m = 0.04675, aperture_width_in = 0.65, weight = 0.5, pole_type = "rod" }
]

[pickups.bridge.circuit]
topology = "single"
L = 4.2
Rdc = 9400.0
Reddy = 90000.0
Ccoil = 9.5e-11
active = true
preamp = "none"
Rvol = 500000.0

# ------------------------------------------------------------------------------
# 3. PASSIVE SOAPBARS PARALLEL + ACTIVE PREAMP (Blend Center Detent / 50-50)
# ------------------------------------------------------------------------------
[pickups.pair_parallel]
name = "Passive Soapbars Parallel with Preamp (Center Detent)"
position_name = "Parallel"
position_from_bridge_m = 0.0950  # Acoustic centroid (135.0mm + 55.0mm) / 2
aperture_width_in = 1.35
coil_spacing_in = 0.0
type = "composite"
magnet_type = "alnico_v"
pole_type = "rod"
resonant_frequency_hz = 3950.0   # Blended active resonance
q_factor = 1.35
components = [
    { pickup = "neck", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

[pickups.pair_parallel.circuit]
topology = "parallel"
active = true
preamp = "none"
Rvol = 500000.0

[pickups.pair_parallel.circuit.neck]
L = 3.8
Rdc = 8600.0
Reddy = 95000.0
Ccoil = 9.5e-11

[pickups.pair_parallel.circuit.bridge]
L = 4.2
Rdc = 9400.0
Reddy = 90000.0
Ccoil = 9.5e-11

# ------------------------------------------------------------------------------
# 4. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Active Dual Soapbar Parallel"
tone_name = "Soapbar Pair"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0

[voicings.neck_solo]
version = 1
name = "Active Solo Neck Soapbar"
tone_name = "Soapbar Neck"
pickup = "neck"
affinity = "neck"
vol_pos = 1.0

[voicings.bridge_solo]
version = 1
name = "Active Solo Bridge Soapbar"
tone_name = "Soapbar Bridge"
pickup = "bridge"
affinity = "bridge"
vol_pos = 1.0

# ------------------------------------------------------------------------------
# 5. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "neck"
bridge = "bridge"
parallel = "pair_parallel"
direct = "pair_parallel"
