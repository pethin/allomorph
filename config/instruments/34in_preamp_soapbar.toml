# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Preamp Soapbar Bass (Ibanez SR / Yamaha TRBX / Sire F10 / Cort)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Modern Neck Soapbar: Centerline 135.0mm from bridge saddle (296.8mm from 12th fret)
#       - Dual round pole coils: forward coil 143.25mm, rearward coil 126.75mm (spacing d = 0.65" / 16.51mm)
#       - Cylindrical rod aperture width: 0.40" (10.16mm) per coil
#   - Modern Bridge Soapbar: Centerline 55.0mm from bridge saddle (376.8mm from 12th fret)
#       - Dual round pole coils: forward coil 63.25mm, rearward coil 46.75mm (spacing d = 0.65" / 16.51mm)
#       - Cylindrical rod aperture width: 0.40" (10.16mm) per coil
# Electronics:
#   - Dual passive Alnico V dual-coil soapbars with exposed cylindrical round pole pieces.
#   - Onboard active 9V/18V 3-band preamp buffer.

id = "34in_preamp_soapbar"
name = "34\" Preamp Soapbar Bass (Dual Humbuckers)"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"
version = 1

# Extended wave speeds: v = 2 * L * f0 (spans B0=30.87Hz to G2=98.00Hz)
string_wave_speeds = [53.31, 71.16, 95.00, 126.81, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_5string"
brand = "D'Addario"
model = "EXL170-5"
gauge = "45-130"
core = "hex"
wrap = "nickel_round"
tension_lbs = 195.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical soapbars mounted in wood)
# ------------------------------------------------------------------------------

[pickups.neck]
name = "Passive Soapbar (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1350  # 135.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-coil soapbar housing
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-coil spacing
type = "dual_coil_parallel"
magnet_type = "alnico_v"
pole_type = "rod"
coils = [
    { id = "forward", strings = ["all"], position_from_bridge_m = 0.14325, aperture_width_in = 0.40, weight = 0.5, pole_type = "rod", L = 3.8, Rdc = 8600.0, Reddy = 95000.0, Ccoil = 2.45e-10 },
    { id = "rearward", strings = ["all"], position_from_bridge_m = 0.12675, aperture_width_in = 0.40, weight = 0.5, pole_type = "rod", L = 3.8, Rdc = 8600.0, Reddy = 95000.0, Ccoil = 2.45e-10 },
]

[pickups.bridge]
name = "Passive Soapbar (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0550  # 55.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-coil soapbar housing
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-coil spacing
type = "dual_coil_parallel"
magnet_type = "alnico_v"
pole_type = "rod"
coils = [
    { id = "forward", strings = ["all"], position_from_bridge_m = 0.06325, aperture_width_in = 0.40, weight = 0.5, pole_type = "rod", L = 4.2, Rdc = 9400.0, Reddy = 90000.0, Ccoil = 1.16e-10 },
    { id = "rearward", strings = ["all"], position_from_bridge_m = 0.04675, aperture_width_in = 0.40, weight = 0.5, pole_type = "rod", L = 4.2, Rdc = 9400.0, Reddy = 90000.0, Ccoil = 1.16e-10 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Active 3-Band Preamp Buffer with MN Blend & Master Volume)
# ------------------------------------------------------------------------------

[harnesses.active]
name = "3-Band Active Preamp with Blend"
type = "active_preamp"
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    ["pickups.neck.hot", "controls.blend.neck_in"],
    ["pickups.neck.cold", "GND"],
    ["pickups.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.bridge.cold", "GND"],
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 250000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Active Dual Soapbar Parallel"
tone_name = "Soapbar Pair"
harness = "active"
controls = { vol = 1.0, blend = 0.5 }

[voicings.neck_solo]
version = 1
name = "Active Soapbar Neck Solo"
tone_name = "Soapbar Neck"
harness = "active"
controls = { vol = 1.0, blend = 0.0 }

[voicings.bridge_solo]
version = 1
name = "Active Soapbar Bridge Solo"
tone_name = "Soapbar Bridge"
harness = "active"
controls = { vol = 1.0, blend = 1.0 }
