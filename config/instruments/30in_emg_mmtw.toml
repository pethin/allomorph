# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 30" Short Scale Bass with Active 18V EMG MMTWX (X-Series)
# ==============================================================================
# Physical Datum: Centerline located 77.5mm from bridge saddle (303.5mm from 12th fret).
# Pickup Hardware: Active 18V EMG MMTWX (X-series, dual-mode Ceramic & Steel).

id = "30in_emg_mmtw"
name = "30\" Short Scale MM (EMG MMTWX)"
scale_length_in = 30.0
scale_length_m = 0.762
electronics = "active"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [62.79, 83.82, 111.89, 149.35]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL160S"
gauge = "50-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 145.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCER (EMG MMTWX Dual-Mode Pickup)
# ------------------------------------------------------------------------------
[pickups.mmtwx]
name = "EMG MMTWX Active Dual-Mode Pickup"
position_name = "Centerline"
position_from_bridge_m = 0.0775  # 77.5mm centerline
aperture_width_in = 1.50         # Overall pickup housing sensing envelope
coil_spacing_in = 0.90           # 0.90" (22.86mm) spacing between coil centers
type = "dual_coil_parallel"
magnet_type = "ceramic_steel"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 2000.0
coils = [
    { id = "neck", strings = ["all"], position_from_bridge_m = 0.08893, aperture_width_in = 0.45, weight = 0.5, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 2.4e-9 },
    { id = "bridge", strings = ["all"], position_from_bridge_m = 0.06607, aperture_width_in = 0.45, weight = 0.5, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 2.4e-9 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Push-Pull Dual/Single Switch & Volume)
# ------------------------------------------------------------------------------
[harnesses.active]
name = "EMG MMTWX Active Harness with Push-Pull Coil Switch"
type = "active_preamp"
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.switches.coil_mode]
name = "Push-Pull Dual/Single Switch"
type = "push_pull"
default = "dual"

[harnesses.active.switches.coil_mode.positions.dual]
connect = [
    ["pickups.mmtwx.neck.hot", "preamp.in"],
    ["pickups.mmtwx.bridge.hot", "preamp.in"],
    ["pickups.mmtwx.neck.cold", "GND"],
    ["pickups.mmtwx.bridge.cold", "GND"],
]
k_mutual = 0.20
components = { "pickups.mmtwx.neck.Ccoil" = 4.86e-9, "pickups.mmtwx.bridge.Ccoil" = 4.86e-9 }

[harnesses.active.switches.coil_mode.positions.single]
connect = [
    ["pickups.mmtwx.bridge.hot", "preamp.in"],
    ["pickups.mmtwx.bridge.cold", "GND"],
    ["pickups.mmtwx.neck.cold", "GND"],
]
k_mutual = 0.0
components = { "pickups.mmtwx.bridge.Ccoil" = 2.68e-9 }

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.dual_mode]
version = 1
name = "Active Dual-Coil Parallel (MM Mode)"
tone_name = "MMTW Dual"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0 }

[voicings.single_mode]
version = 1
name = "Active Single-Coil Stacked (J Mode)"
tone_name = "MMTW Single"
harness = "active"
switches = { coil_mode = "single" }
controls = { vol = 1.0 }

[voicings.dual_warm]
version = 1
name = "Active Dual-Coil Warm Low-Mid Bloom"
tone_name = "MMTW Warm"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0 }
preamp_bands = [
    { type = "low_pass", freq_hz = 650.0, gain_db = 0.0, q = 1.6 }
]
