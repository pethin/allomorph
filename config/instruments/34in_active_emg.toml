# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Active EMG Soapbar Bass (Spector / ESP / Schecter)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Modern Neck Soapbar: Centerline 135.0mm from bridge saddle (296.8mm from 12th fret)
#       - Dual blade coils: forward coil 143.25mm, rearward coil 126.75mm (spacing d = 0.65" / 16.51mm)
#       - Aperture width: 1.35" (34.3mm)
#   - Modern Bridge Soapbar: Centerline 55.0mm from bridge saddle (376.8mm from 12th fret)
#       - Dual blade coils: forward coil 63.25mm, rearward coil 46.75mm (spacing d = 0.65" / 16.51mm)
#       - Aperture width: 1.35" (34.3mm)
# Electronics:
#   - Active EMG 40/35 series soapbars with integrated low-noise internal preamplifier.
#   - 10 kOhm low output impedance line driver, flat sub-audible DC transmission (H(0) >= 1.0).
#   - Calibrated under Option C (Universal Active EMG Baseline @ fr = 4.15 kHz):
#       - Bridges published factory specs of EMG 40CS (3.75 kHz) and EMG 40DC (4.55 kHz).
#       - Optimal for 4-string (EMG 35), 5-string (EMG 40), and 6-string (EMG 45) active soapbar instruments.
#   - Neck Soapbar active resonance: 4150.0 Hz, Q = 1.40.
#   - Bridge Soapbar active resonance: 4150.0 Hz, Q = 1.40.
#   - Parallel center blend active resonance: 4150.0 Hz, Q = 1.35.

id = "34in_active_emg"
name = "34\" Active EMG Bass (Option C Baseline)"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"
version = 1

# Extended wave speeds: v = 2 * L * f0 (spans B0=30.87Hz to G2=98.00Hz for 4, 5, and 6-string universal compatibility)
string_wave_speeds = [53.31, 71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard 5-string nickel roundwounds (D'Addario EXL170-5 .045-.130).
[strings]
preset = "roundwound_nickel_5string"
brand = "D'Addario"
model = "EXL170-5"
gauge = "45-130"
core = "hex"
wrap = "nickel_round"
tension_lbs = 195.0

# ------------------------------------------------------------------------------
# 1. ACTIVE EMG SOAPBAR (Neck Solo)
# ------------------------------------------------------------------------------
[pickups.neck]
name = "Active EMG Soapbar (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1350  # 135.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-blade sensing envelope
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-blade spacing
type = "dual_coil_parallel"
magnet_type = "ceramic"
pole_type = "blade"
resonant_frequency_hz = 4150.0   # Active EMG buffered resonance (Option C midpoint)
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.14325, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" },
    { strings = ["all"], position_from_bridge_m = 0.12675, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" }
]

[pickups.neck.circuit]
topology = "single"
L = 2.0
Rdc = 4500.0
Reddy = 72000.0
Ccoil = 5.1e-10
vsat = 0.50
active = true
preamp = "none"
Rvol = 25000.0

# ------------------------------------------------------------------------------
# 2. ACTIVE EMG SOAPBAR (Bridge Solo)
# ------------------------------------------------------------------------------
[pickups.bridge]
name = "Active EMG Soapbar (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0550  # 55.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-blade sensing envelope
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-blade spacing
type = "dual_coil_parallel"
magnet_type = "ceramic"
pole_type = "blade"
resonant_frequency_hz = 4150.0   # Active EMG buffered resonance (Option C midpoint)
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.06325, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" },
    { strings = ["all"], position_from_bridge_m = 0.04675, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" }
]

[pickups.bridge.circuit]
topology = "single"
L = 2.0
Rdc = 4500.0
Reddy = 72000.0
Ccoil = 5.1e-10
vsat = 0.50
active = true
preamp = "none"
Rvol = 25000.0

# ------------------------------------------------------------------------------
# 3. ACTIVE EMG SOAPBARS PARALLEL (Center Detent / 50-50 Mix)
# ------------------------------------------------------------------------------
[pickups.pair_parallel]
name = "Active EMG Soapbars Parallel (Center Detent)"
position_name = "Parallel"
position_from_bridge_m = 0.0950  # Acoustic centroid (135.0mm + 55.0mm) / 2
aperture_width_in = 1.35
coil_spacing_in = 0.0
type = "composite"
magnet_type = "ceramic"
pole_type = "blade"
resonant_frequency_hz = 4150.0   # Blended active resonance
q_factor = 1.35
components = [
    { pickup = "neck", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

[pickups.pair_parallel.circuit]
topology = "parallel"
active = true
preamp = "none"
Rvol = 25000.0

[pickups.pair_parallel.circuit.neck]
L = 2.0
Rdc = 4500.0
Reddy = 72000.0
Ccoil = 5.1e-10
vsat = 0.50

[pickups.pair_parallel.circuit.bridge]
L = 2.0
Rdc = 4500.0
Reddy = 72000.0
Ccoil = 5.1e-10
vsat = 0.50

# ------------------------------------------------------------------------------
# 4. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Active Dual EMG J Parallel"
tone_name = "Active EMG Pair"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0

[voicings.neck_solo]
version = 1
name = "Active Solo EMG J Neck"
tone_name = "Active EMG Neck"
pickup = "neck"
affinity = "neck"
vol_pos = 1.0

[voicings.bridge_solo]
version = 1
name = "Active Solo EMG J Bridge"
tone_name = "Active EMG Bridge"
pickup = "bridge"
affinity = "bridge"
vol_pos = 1.0

# ------------------------------------------------------------------------------
# 5. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "neck"
bridge = "bridge"
parallel = "pair_parallel"
direct = "pair_parallel"
