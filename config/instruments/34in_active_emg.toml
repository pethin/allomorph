# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Active EMG Soapbar Bass (Spector / ESP / Schecter)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Modern Neck Soapbar: Centerline 135.0mm from bridge saddle (296.8mm from 12th fret)
#       - Dual blade coils: forward coil 143.25mm, rearward coil 126.75mm (spacing d = 0.65" / 16.51mm)
#       - Aperture width: 1.35" (34.3mm)
#   - Modern Bridge Soapbar: Centerline 55.0mm from bridge saddle (376.8mm from 12th fret)
#       - Dual blade coils: forward coil 63.25mm, rearward coil 46.75mm (spacing d = 0.65" / 16.51mm)
#       - Aperture width: 1.35" (34.3mm)
# Electronics:
#   - Active EMG 40/35 series soapbars with integrated low-noise internal preamplifier.
#   - 10 kOhm low output impedance line driver.

id = "34in_active_emg"
name = "34\" Active EMG Bass (Option C Baseline)"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"
version = 1

# Extended wave speeds: v = 2 * L * f0 (spans B0=30.87Hz to G2=98.00Hz)
string_wave_speeds = [53.31, 71.16, 95.00, 126.81, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_5string"
brand = "D'Addario"
model = "EXL170-5"
gauge = "45-130"
core = "hex"
wrap = "nickel_round"
tension_lbs = 195.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Active EMG Soapbars with internal op-amp buffers)
# ------------------------------------------------------------------------------

[pickups.neck]
name = "Active EMG Soapbar (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1350  # 135.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-blade sensing envelope
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-blade spacing
type = "dual_coil_parallel"
magnet_type = "ceramic"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 10000.0
coils = [
    { id = "forward", strings = ["all"], position_from_bridge_m = 0.14325, aperture_width_in = 0.40, weight = 0.5, pole_type = "blade", L = 2.0, Rdc = 4500.0, Reddy = 72000.0, Ccoil = 6.25e-10 },
    { id = "rearward", strings = ["all"], position_from_bridge_m = 0.12675, aperture_width_in = 0.40, weight = 0.5, pole_type = "blade", L = 2.0, Rdc = 4500.0, Reddy = 72000.0, Ccoil = 6.25e-10 },
]

[pickups.bridge]
name = "Active EMG Soapbar (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0550  # 55.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-blade sensing envelope
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-blade spacing
type = "dual_coil_parallel"
magnet_type = "ceramic"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 10000.0
coils = [
    { id = "forward", strings = ["all"], position_from_bridge_m = 0.06325, aperture_width_in = 0.40, weight = 0.5, pole_type = "blade", L = 2.0, Rdc = 4500.0, Reddy = 72000.0, Ccoil = 6.25e-10 },
    { id = "rearward", strings = ["all"], position_from_bridge_m = 0.04675, aperture_width_in = 0.40, weight = 0.5, pole_type = "blade", L = 2.0, Rdc = 4500.0, Reddy = 72000.0, Ccoil = 6.25e-10 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (EMG ABC Active Blend & Master Volume)
# ------------------------------------------------------------------------------

[harnesses.active]
name = "EMG Active Blend & Volume Harness"
type = "active_preamp"
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    ["pickups.neck.hot", "controls.blend.neck_in"],
    ["pickups.neck.cold", "GND"],
    ["pickups.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.bridge.cold", "GND"],
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 25000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Active EMG Soapbars Parallel (Center Detent)"
tone_name = "EMG Soapbar Parallel"
harness = "active"
controls = { vol = 1.0, blend = 0.5 }

[voicings.neck_solo]
version = 1
name = "Active EMG Soapbar (Neck Solo)"
tone_name = "EMG Soapbar Neck"
harness = "active"
controls = { vol = 1.0, blend = 0.0 }

[voicings.bridge_solo]
version = 1
name = "Active EMG Soapbar (Bridge Solo)"
tone_name = "EMG Soapbar Bridge"
harness = "active"
controls = { vol = 1.0, blend = 1.0 }
