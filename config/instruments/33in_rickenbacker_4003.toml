# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 33.25" Rickenbacker 4003 (Maple Neck-Through)
# ==============================================================================

id = "33in_rickenbacker_4003"
name = "33.25\" Rickenbacker 4003"
scale_length_in = 33.25
scale_length_m = 0.84455
electronics = "passive"
version = 1

string_wave_speeds = [69.60, 92.90, 124.01, 165.53]

[strings]
preset = "roundwound_nickel_standard"
brand = "Rickenbacker"
model = "Standard 4-String"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 168.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.neck]
name = "Rickenbacker Hi-Gain Neck Single-Coil"
position_name = "Neck"
position_from_bridge_m = 0.2100  # 8.25" (210.0mm) datum (24th fret harmonic node)
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "ceramic"
coils = [
    { id = "neck", position_from_bridge_m = 0.2100, aperture_width_in = 0.45, pole_type = "rod", L = 3.5, Rdc = 8000.0, Reddy = 120000.0, Ccoil = 8.0e-11, weight = 1.0 },
]

[pickups.bridge]
name = "Rickenbacker Hi-Gain Bridge Single-Coil"
position_name = "Bridge"
position_from_bridge_m = 0.1080  # 4.25" (108.0mm) datum from bridge saddles
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "ceramic"
coils = [
    { id = "bridge", position_from_bridge_m = 0.1080, aperture_width_in = 0.45, pole_type = "rod", L = 3.8, Rdc = 8400.0, Reddy = 110000.0, Ccoil = 8.5e-11, weight = 1.0 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Authentic 2V/2T Passive Cavity Wiring)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "Rickenbacker 4003 2V/2T Passive Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0

wiring = [
    ["pickups.neck.hot", "controls.neck_vol.wiper"],
    ["controls.neck_vol.in", "neck_bus"],
    ["controls.neck_vol.gnd", "GND"],
    ["pickups.neck.cold", "GND"],
    ["neck_bus", "controls.neck_tone.in"],
    ["controls.neck_tone.gnd", "GND"],

    ["controls.bridge_vol.in", "bridge_bus"],
    ["controls.bridge_vol.gnd", "GND"],
    ["pickups.bridge.cold", "GND"],
    ["bridge_bus", "controls.bridge_tone.in"],
    ["controls.bridge_tone.gnd", "GND"],
]

[harnesses.passive.controls.neck_vol]
name = "Neck Volume"
type = "pot"
taper = "audio_15"
resistance = 330000.0
default = 1.0

[harnesses.passive.controls.neck_tone]
name = "Neck Tone"
type = "pot"
taper = "audio_15"
resistance = 330000.0
cap = 4.7e-8
default = 1.0

[harnesses.passive.controls.bridge_vol]
name = "Bridge Volume"
type = "pot"
taper = "audio_15"
resistance = 330000.0
default = 1.0

[harnesses.passive.controls.bridge_tone]
name = "Bridge Tone"
type = "pot"
taper = "audio_15"
resistance = 330000.0
cap = 4.7e-8
default = 1.0

[harnesses.passive.switches.pickup_selector]
name = "Pickup Selector"
type = "toggle"
default = "both"

[harnesses.passive.switches.pickup_selector.positions.neck]
connect = [["neck_bus", "out"]]

[harnesses.passive.switches.pickup_selector.positions.bridge]
connect = [["bridge_bus", "out"]]

[harnesses.passive.switches.pickup_selector.positions.both]
connect = [["neck_bus", "out"], ["bridge_bus", "out"]]
k_mutual = 0.04

[harnesses.passive.switches.vintage_tone]
name = "Push-Pull Vintage Tone"
type = "push_pull"
default = "bypass"

[harnesses.passive.switches.vintage_tone.positions.bypass]
connect = [["pickups.bridge.hot", "controls.bridge_vol.wiper"]]

[harnesses.passive.switches.vintage_tone.positions.vintage]
connect = [
    ["pickups.bridge.hot", "vintage_cap.in"],
    ["vintage_cap.out", "controls.bridge_vol.wiper"],
]
components = { "vintage_cap" = 4.7e-9 }

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.bridge_clank]
version = 1
name = "Vintage 4003 Bridge Clank (4.7nF HPF)"
tone_name = "Rickenbacker Clank"
harness = "passive"
switches = { pickup_selector = "bridge", vintage_tone = "vintage" }
controls = { bridge_vol = 1.0, bridge_tone = 1.0 }

[voicings.bridge_open]
version = 1
name = "Modern 4003 Bridge Open (Bypass HPF)"
tone_name = "Rickenbacker Open"
harness = "passive"
switches = { pickup_selector = "bridge", vintage_tone = "bypass" }
controls = { bridge_vol = 1.0, bridge_tone = 1.0 }

[voicings.neck_warm]
version = 1
name = "4003 Neck Warm"
tone_name = "Rickenbacker Neck"
harness = "passive"
switches = { pickup_selector = "neck", vintage_tone = "bypass" }
controls = { neck_vol = 1.0, neck_tone = 1.0 }

[voicings.pair_open]
version = 1
name = "4003 Dual Pickups Parallel"
tone_name = "Rickenbacker Pair"
harness = "passive"
switches = { pickup_selector = "both", vintage_tone = "bypass" }
controls = { neck_vol = 1.0, neck_tone = 1.0, bridge_vol = 1.0, bridge_tone = 1.0 }
