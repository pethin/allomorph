# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 30" Short Scale Fender Mustang Bass PJ (Player Series / Vintera / CV)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 30.0" (762.0mm total, 381.0mm 12th fret to bridge saddle)
#   - Split-P Neck Pickup: Centerline 155.0mm from bridge saddle (226.0mm from 12th fret)
#       - E/A half (forward towards neck): 167.0mm from bridge (214.0mm from 12th fret)
#       - D/G half (rearward towards bridge): 143.0mm from bridge (238.0mm from 12th fret)
#       - Aperture width: 0.45" (11.4mm) magnetic sensing aperture per coil half
#   - Jazz Bridge Single-Coil: Centerline 55.0mm from bridge saddle (326.0mm from 12th fret)
#       - Aperture width: 0.45" (11.4mm) magnetic sensing aperture
# Electronics:
#   - Passive high-impedance circuit: 250k volume pot, 250k tone pot (47nF cap), 3-way toggle.

id = "30in_mustang_pj"
name = "30\" Mustang Bass PJ (Short Scale)"
scale_length_in = 30.0
scale_length_m = 0.762
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [62.79, 83.82, 111.89, 149.35]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL160S"
gauge = "50-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 145.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.split_p]
name = "Mustang PJ Split-P (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1550  # Centerline 155.0mm
aperture_width_in = 0.45         # 0.45" magnetic sensing aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "alnico_v"
coils = [
    # Strings 3 & 4 see forward coil half (deeper fundamental)
    { id = "forward", strings = [3, 4], position_from_bridge_m = 0.1670, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 90000.0, Ccoil = 3e-11, weight = 1.0 },
    # Strings 1 & 2 see rearward coil half (snappy transient bite)
    { id = "rearward", strings = [1, 2], position_from_bridge_m = 0.1430, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 90000.0, Ccoil = 3e-11, weight = 1.0 },
]

[pickups.bridge_j]
name = "Mustang PJ Single-Coil J (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0550  # 55.0mm from bridge
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
coils = [
    { id = "bridge", position_from_bridge_m = 0.0550, aperture_width_in = 0.45, pole_type = "rod", L = 3.6, Rdc = 7800.0, Reddy = 125000.0, Ccoil = 7.0e-11, weight = 1.0 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Passive 1V/1T with 3-Way Toggle Switch)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "Mustang PJ 1V/1T Passive Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0

wiring = [
    # Split P series
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],
    ["pickups.split_p.rearward.cold", "GND"],

    # Bridge J cold
    ["pickups.bridge_j.cold", "GND"],

    # Master Volume & Tone
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
    ["controls.vol.in", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
]

[harnesses.passive.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 250000.0
cap = 4.7e-8
default = 1.0

[harnesses.passive.switches.pickup_selector]
name = "Pickup Selector"
type = "toggle"
default = "both"

[harnesses.passive.switches.pickup_selector.positions.neck]
connect = [["pickups.split_p.forward.hot", "controls.vol.in"]]

[harnesses.passive.switches.pickup_selector.positions.bridge]
connect = [["pickups.bridge_j.hot", "controls.vol.in"]]

[harnesses.passive.switches.pickup_selector.positions.both]
connect = [
    ["pickups.split_p.forward.hot", "controls.vol.in"],
    ["pickups.bridge_j.hot", "controls.vol.in"],
]
k_mutual = 0.04

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Short Scale P/J Parallel"
tone_name = "Mustang PJ Parallel"
harness = "passive"
switches = { pickup_selector = "both" }
controls = { vol = 1.0, tone = 1.0 }

[voicings.p_warm]
version = 1
name = "Short Scale Split-P Warm"
tone_name = "Mustang PJ Neck Warm"
harness = "passive"
switches = { pickup_selector = "neck" }
controls = { vol = 1.0, tone = 1.0 }

[voicings.j_growl]
version = 1
name = "Short Scale Bridge J Growl"
tone_name = "Mustang PJ Bridge Growl"
harness = "passive"
switches = { pickup_selector = "bridge" }
controls = { vol = 1.0, tone = 1.0 }
