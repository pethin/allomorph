# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34"-37" Multi-Scale Dingwall 5-String (Combustion / NG / D-Roc)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34"-37" Multi-Scale (37.0" low B, 34.0" high G)
#   - Transverse Wave Speeds: 58.02 m/s (B) to 169.27 m/s (G)
#   - Bridge Sweet Spot (FD3n Bridge): Centerline 48.0mm from bridge saddle
#   - Middle Position (FD3n Middle): Centerline 96.0mm from bridge saddle
#   - Parallel Summing (Bridge + Middle): Centerline 72.0mm from bridge saddle
# Electronics:
#   - Active onboard buffer (Darkglass Tone Capsule / EMG active buffer).
#   - High dynamic headroom, cable isolated (< 1.0 kOhm output impedance).
#   - FD3n loaded resonance: 3.40 kHz, Q = 1.50.

id = "37in_multiscale_dingwall"
name = "37\" Multi-Scale Dingwall 5-String (FD3n)"
scale_length_in = 37.0
scale_length_m = 0.9398
scale_min_in = 34.0
scale_max_in = 37.0
is_multiscale = true
electronics = "active"
version = 1

# String wave speeds for 34"-37" 5-string multi-scale (B0, E1, A1, D2, G2)
string_wave_speeds = [58.02, 75.88, 99.19, 129.60, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with custom-scale Dingwall stainless steel / nickel roundwounds (5-string).
[strings]
preset = "roundwound_stainless_clank"
brand = "Dingwall"
model = "Custom Multi-Scale 5-String"
gauge = "45-130"
core = "hex"
wrap = "stainless_round"
tension_lbs = 220.0

# ------------------------------------------------------------------------------
# 1. DINGWALL FD3n NEODYMIUM (Bridge Solo)
# ------------------------------------------------------------------------------
[pickups.bridge]
name = "Dingwall FD3n Neodymium (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0480  # Angled bridge sweet spot 48.0mm
aperture_width_in = 0.85
coil_spacing_in = 0.65
type = "dual_coil_parallel"
magnet_type = "neodymium"
alpha = 0.08
resonant_frequency_hz = 3400.0   # Active buffered resonance
q_factor = 1.50
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0575, aperture_width_in = 0.75, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.0385, aperture_width_in = 0.75, weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 2. DINGWALL FD3n NEODYMIUM (Middle Solo)
# ------------------------------------------------------------------------------

[pickups.bridge.circuit]
topology = "single"
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10
vsat = 0.9
active = true
preamp = "none"
Rvol = 500000.0

[pickups.middle]
name = "Dingwall FD3n Neodymium (Middle)"
position_name = "Middle"
position_from_bridge_m = 0.0960  # Middle placement 96.0mm
aperture_width_in = 0.85
coil_spacing_in = 0.65
type = "dual_coil_parallel"
magnet_type = "neodymium"
resonant_frequency_hz = 3400.0
q_factor = 1.50
coils = [
    { strings = ["all"], position_from_bridge_m = 0.10425, aperture_width_in = 0.65, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.08775, aperture_width_in = 0.65, weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 3. DINGWALL BRIDGE + MIDDLE PARALLEL (Position 2 on Rotary Selector)
# ------------------------------------------------------------------------------

[pickups.middle.circuit]
topology = "single"
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10
active = true
preamp = "none"
Rvol = 500000.0

[pickups.pair_parallel]
name = "Dingwall Bridge + Middle Parallel"
position_name = "Parallel"
position_from_bridge_m = 0.0720  # Centroid 72.0mm
aperture_width_in = 0.85
coil_spacing_in = 0.0
type = "composite"
magnet_type = "neodymium"
resonant_frequency_hz = 3600.0
q_factor = 1.40
components = [
    { pickup = "bridge", weight = 0.5 },
    { pickup = "middle", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest physical pickup state on the Dingwall:
#   - Bridge Solo (Pos 1): Voice 13 (Dingwall Multi-Scale Bridge) is an exact 1:1 identity match!
#   - Parallel (Pos 2): Jazz and P/J dual-coil hybrid voicings
#   - Middle Solo (Pos 3): Precision bass, Mudbucker, and Upright fullness


[pickups.pair_parallel.circuit]
topology = "parallel"
active = true
preamp = "none"
Rvol = 500000.0

[pickups.pair_parallel.circuit.neck]
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10

[pickups.pair_parallel.circuit.bridge]
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10

[pickups.pair_series]
name = "Dingwall Bridge + Middle Series"
position_name = "Series"
bundle_name = "series"
position_from_bridge_m = 0.0720  # Centroid 72.0mm
aperture_width_in = 0.85
coil_spacing_in = 0.0
type = "composite"
magnet_type = "neodymium"
resonant_frequency_hz = 3100.0
q_factor = 1.60
components = [
    { pickup = "bridge", weight = 0.5 },
    { pickup = "middle", weight = 0.5 }
]

[pickups.pair_series.circuit]
topology = "series"
active = true
preamp = "none"
Rvol = 500000.0

[pickups.pair_series.circuit.neck]
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10

[pickups.pair_series.circuit.bridge]
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10

# ------------------------------------------------------------------------------
# 2. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.bridge_clank]
version = 1
name = "FD3 Solo Bridge Multiscale Clarity"
tone_name = "Dingwall Bridge"
pickup = "bridge"
affinity = "bridge"
vol_pos = 1.0
string_preset_override = "roundwound_stainless_clank"

[voicings.middle_growl]
version = 1
name = "FD3 Solo Middle Punch"
tone_name = "Dingwall Middle"
pickup = "middle"
affinity = "neck"
vol_pos = 1.0
string_preset_override = "roundwound_stainless_clank"

[voicings.pair_parallel]
version = 1
name = "FD3 Bridge + Middle Parallel"
tone_name = "Dingwall Parallel"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0
string_preset_override = "roundwound_stainless_clank"

[voicings.pair_series]
version = 1
name = "FD3 Bridge + Middle Series Wall of Sound"
tone_name = "Dingwall Series"
pickup = "pair_series"
affinity = "parallel"
vol_pos = 1.0
gain_db = 5.6
string_preset_override = "roundwound_stainless_clank"

# ------------------------------------------------------------------------------
# 3. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "middle"
bridge = "bridge"
parallel = "pair_parallel"
series = "pair_series"
direct = "pair_parallel"
dingwall_bridge = "bridge"
dingwall_series = "pair_series"
"37in_multiscale_dingwall:bridge_clank" = "bridge"
