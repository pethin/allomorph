# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34"-37" Multi-Scale Dingwall 5-String (Combustion / NG / D-Roc)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34"-37" Multi-Scale (37.0" low B, 34.0" high G)
#   - Transverse Wave Speeds: 58.02 m/s (B) to 169.27 m/s (G)
#   - Bridge Sweet Spot (FD3n Bridge): Centerline 48.0mm from bridge saddle
#   - Middle Position (FD3n Middle): Centerline 96.0mm from bridge saddle
#   - Parallel Summing (Bridge + Middle): Centerline 72.0mm from bridge saddle
# Electronics:
#   - Active onboard buffer (Darkglass Tone Capsule / EMG active buffer).

id = "37in_multiscale_dingwall"
name = "37\" Multi-Scale Dingwall 5-String (FD3n)"
scale_length_in = 37.0
scale_length_m = 0.9398
scale_min_in = 34.0
scale_max_in = 37.0
is_multiscale = true
electronics = "active"
version = 1

# String wave speeds for 34"-37" 5-string multi-scale (B0, E1, A1, D2, G2)
string_wave_speeds = [58.02, 75.88, 99.19, 129.60, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with custom-scale Dingwall stainless steel / nickel roundwounds (5-string).
[strings]
preset = "roundwound_stainless_clank"
brand = "Dingwall"
model = "Custom Multi-Scale 5-String"
gauge = "45-130"
core = "hex"
wrap = "stainless_round"
tension_lbs = 220.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.middle]
name = "Dingwall FD3n Neodymium (Middle)"
position_name = "Middle"
position_from_bridge_m = 0.0960  # Middle placement 96.0mm
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "neodymium"
coils = [
    # Reverse split-P: treble strings (1, 2) forward half, bass strings (3, 4, 5) rearward half
    { id = "forward", strings = [1, 2], position_from_bridge_m = 0.10425, aperture_width_in = 0.40, pole_type = "rod", L = 1.15, Rdc = 2200.0, Reddy = 150000.0, Ccoil = 6e-11, weight = 0.5 },
    { id = "rearward", strings = [3, 4, 5], position_from_bridge_m = 0.08775, aperture_width_in = 0.40, pole_type = "rod", L = 1.15, Rdc = 2200.0, Reddy = 150000.0, Ccoil = 6e-11, weight = 0.5 },
]

[pickups.bridge]
name = "Dingwall FD3n Neodymium (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0480  # Angled bridge sweet spot 48.0mm
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "neodymium"
coils = [
    # Reverse split-P: treble strings (1, 2) forward half, bass strings (3, 4, 5) rearward half
    { id = "forward", strings = [1, 2], position_from_bridge_m = 0.0575, aperture_width_in = 0.40, pole_type = "rod", L = 1.15, Rdc = 2200.0, Reddy = 150000.0, Ccoil = 6e-11, weight = 0.5 },
    { id = "rearward", strings = [3, 4, 5], position_from_bridge_m = 0.0385, aperture_width_in = 0.40, pole_type = "rod", L = 1.15, Rdc = 2200.0, Reddy = 150000.0, Ccoil = 6e-11, weight = 0.5 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Dingwall Active Rotary & Preamp Harness)
# ------------------------------------------------------------------------------

[harnesses.active]
name = "Dingwall Active Rotary & Preamp Harness"
type = "active_preamp"
preamp = "dingwall_active"
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    # Middle coils in series
    ["pickups.middle.forward.cold", "pickups.middle.rearward.hot"],

    # Bridge coils in series
    ["pickups.bridge.forward.cold", "pickups.bridge.rearward.hot"],

    # Preamp & Volume
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.controls.bass]
name = "Bass Boost/Cut"
type = "preamp_band"
band = "bass"
default = 0.5

[harnesses.active.controls.low_mid]
name = "Low-Mid Boost/Cut"
type = "preamp_band"
band = "bell"
default = 0.5

[harnesses.active.controls.high_mid]
name = "High-Mid Boost/Cut"
type = "preamp_band"
band = "bell"
default = 0.5

[harnesses.active.switches.rotary]
name = "Rotary Pickup Selector"
type = "rotary"
default = "parallel"

[harnesses.active.switches.rotary.positions.bridge]
connect = [
    ["pickups.bridge.rearward.cold", "GND"],
    ["pickups.bridge.forward.hot", "preamp.in"],
]

[harnesses.active.switches.rotary.positions.parallel]
connect = [
    ["pickups.bridge.rearward.cold", "GND"],
    ["pickups.bridge.forward.hot", "preamp.in"],
    ["pickups.middle.rearward.cold", "GND"],
    ["pickups.middle.forward.hot", "preamp.in"],
]

[harnesses.active.switches.rotary.positions.series]
connect = [
    ["pickups.bridge.rearward.cold", "GND"],
    ["pickups.bridge.forward.hot", "pickups.middle.rearward.cold"],
    ["pickups.middle.forward.hot", "preamp.in"],
]

[harnesses.active.switches.rotary.positions.middle]
connect = [
    ["pickups.middle.rearward.cold", "GND"],
    ["pickups.middle.forward.hot", "preamp.in"],
]

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.bridge_clank]
version = 1
name = "FD3 Solo Bridge Multiscale Clarity"
tone_name = "Dingwall Bridge"
harness = "active"
switches = { rotary = "bridge" }
controls = { vol = 1.0, bass = 0.5, low_mid = 0.5, high_mid = 0.5 }
string_preset_override = "roundwound_stainless_clank"

[voicings.middle_growl]
version = 1
name = "FD3 Solo Middle Punch"
tone_name = "Dingwall Middle"
harness = "active"
switches = { rotary = "middle" }
controls = { vol = 1.0, bass = 0.5, low_mid = 0.5, high_mid = 0.5 }
string_preset_override = "roundwound_stainless_clank"

[voicings.pair_parallel]
version = 1
name = "FD3 Bridge + Middle Parallel"
tone_name = "Dingwall Parallel"
harness = "active"
switches = { rotary = "parallel" }
controls = { vol = 1.0, bass = 0.5, low_mid = 0.5, high_mid = 0.5 }
string_preset_override = "roundwound_stainless_clank"

[voicings.pair_series]
version = 1
name = "FD3 Bridge + Middle Series Wall of Sound"
tone_name = "Dingwall Series"
harness = "active"
switches = { rotary = "series" }
controls = { vol = 1.0, bass = 0.5, low_mid = 0.5, high_mid = 0.5 }
string_preset_override = "roundwound_stainless_clank"
