# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale P/J Bass (Split-P Neck + Single-Coil Jazz Bridge)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Standard Fender Split-Coil P: Centerline 125.0mm from bridge saddle
#       - E/A half (forward towards neck): 139.0mm from bridge (292.8mm from 12th fret)
#       - D/G half (rearward towards bridge): 111.0mm from bridge (320.8mm from 12th fret)
#       - Aperture width: 0.45" (11.4mm) magnetic sensing aperture per coil half
#   - 60s/Modern Bridge Single-Coil: 63.5mm from bridge saddle (368.3mm from 12th fret, 14 1/2")
#       - Aperture width: 0.45" (11.4mm) narrow single-coil magnetic sensing aperture

id = "34in_standard_pj"
name = "34\" Standard P/J Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.split_p]
name = "Vintage Split-Coil P (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1250  # Centerline 125.0mm
aperture_width_in = 0.45         # 0.45" magnetic sensing aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "alnico_v"
coils = [
    # Strings 3 & 4 see forward coil half (warmer, deeper fundamental)
    { id = "forward", strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 90000.0, Ccoil = 3e-11, weight = 1.0 },
    # Strings 1 & 2 see rearward coil half (tighter, punchier mid bite)
    { id = "rearward", strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 90000.0, Ccoil = 3e-11, weight = 1.0 },
]

[pickups.bridge_j]
name = "60s Jazz Bridge Single-Coil"
position_name = "Bridge"
position_from_bridge_m = 0.0635  # 63.5mm from bridge (14 1/2" from 12th fret)
aperture_width_in = 0.45         # 0.45" narrow single-coil sensing aperture
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
coils = [
    { id = "bridge", position_from_bridge_m = 0.0635, aperture_width_in = 0.45, pole_type = "rod", L = 3.6, Rdc = 7800.0, Reddy = 125000.0, Ccoil = 7.0e-11, weight = 1.0 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESSES (Multi-Harness: Authentic 2V/1T Passive and Active 2-Band)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "P/J 2V/1T Passive Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0
k_mutual = 0.04

wiring = [
    # Split P in humbucking series
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],
    ["pickups.split_p.rearward.cold", "GND"],
    ["pickups.split_p.forward.hot", "controls.p_vol.wiper"],
    ["controls.p_vol.in", "bus"],
    ["controls.p_vol.gnd", "GND"],

    # Bridge J
    ["pickups.bridge_j.hot", "controls.j_vol.wiper"],
    ["controls.j_vol.in", "bus"],
    ["controls.j_vol.gnd", "GND"],
    ["pickups.bridge_j.cold", "GND"],

    # Master tone & output
    ["bus", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
    ["bus", "out"],
]

[harnesses.passive.controls.p_vol]
name = "P Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.j_vol]
name = "J Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 250000.0
cap = 4.7e-8
default = 1.0

[harnesses.active]
name = "Sadowsky 2-Band Active Preamp"
type = "active_preamp"
preamp = "sadowsky_2band"
load_resistance = 1000000.0
cable_pf = 30.0
k_mutual = 0.04

wiring = [
    # Split P into neck_in
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],
    ["pickups.split_p.rearward.cold", "GND"],
    ["pickups.split_p.forward.hot", "controls.blend.neck_in"],

    # Bridge J into bridge_in
    ["pickups.bridge_j.hot", "controls.blend.bridge_in"],
    ["pickups.bridge_j.cold", "GND"],

    # Preamp & Volume
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 250000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.controls.bass]
name = "Bass Boost"
type = "preamp_band"
band = "bass"
default = 0.5

[harnesses.active.controls.treble]
name = "Treble Boost"
type = "preamp_band"
band = "treble"
default = 0.5

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Vintage P/J Parallel (Both Volumes 100%)"
tone_name = "PJ Passive"
harness = "passive"
controls = { p_vol = 1.0, j_vol = 1.0, tone = 1.0 }

[voicings.neck_active]
version = 1
name = "Modern Ceramic Split-Coil (Neck Active)"
tone_name = "PJ Neck Active"
harness = "active"
controls = { vol = 1.0, blend = 0.0, bass = 0.5, treble = 0.5 }

[voicings.pair_active]
version = 1
name = "Modern Sadowsky Active P/J Pair"
tone_name = "PJ Active"
harness = "active"
controls = { vol = 1.0, blend = 0.5, bass = 0.5, treble = 0.5 }

[voicings.p_warm]
version = 1
name = "Vintage Split-P Warm"
tone_name = "PJ Neck Warm"
harness = "passive"
controls = { p_vol = 1.0, j_vol = 0.0, tone = 1.0 }

[voicings.j_growl]
version = 1
name = "Vintage 60s Bridge J Growl"
tone_name = "PJ Bridge Growl"
harness = "passive"
controls = { p_vol = 0.0, j_vol = 1.0, tone = 1.0 }
