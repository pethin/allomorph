# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale P/J Bass (Split-P Neck + Single-Coil Jazz Bridge)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Standard Fender Split-Coil P: Centerline 125.0mm from bridge saddle
#       - E/A half (forward towards neck): 139.0mm from bridge (292.8mm from 12th fret)
#       - D/G half (rearward towards bridge): 111.0mm from bridge (320.8mm from 12th fret)
#       - Aperture width: 1.00" (25.4mm) per coil half
#   - 60s/Modern Bridge Single-Coil: 63.5mm from bridge saddle (368.3mm from 12th fret, 14 1/2")
#       - Aperture width: 0.75" (19.05mm) narrow single-coil sensing envelope
# Electronics:
#   - Passive high-impedance circuit: Dual 250k audio volume pots (V/V/T), 250k master tone (47nF cap).
#   - Parallel summing loaded resonance: 2.80 kHz, Q = 1.20 (125k net vol load + 750pF cable).
#   - Solo Split-P loaded resonance: 2.80 kHz, Q = 1.40 (250k vol load + 750pF cable).
#   - Solo Bridge loaded resonance: 3.20 kHz, Q = 1.60 (250k vol load + 750pF cable).

id = "34in_standard_pj"
name = "34\" Standard P/J Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard nickel roundwounds (D'Addario EXL165 / Fender 7250M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. STANDARD FENDER SPLIT-COIL P (Neck Solo)
# ------------------------------------------------------------------------------
[pickups.p]
name = "Vintage Split-Coil P (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1250  # Centerline 125.0mm
aperture_width_in = 1.00         # 1.00" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "alnico_v"
resonant_frequency_hz = 2800.0   # Standard Fender split-coil loaded resonance (2.8 kHz)
q_factor = 1.40                  # Vintage Alnico V loaded Q factor
coils = [
    # Strings 3 & 4 see forward coil half (warmer, deeper fundamental)
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    # Strings 1 & 2 see rearward coil half (tighter, punchier mid bite)
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. 60s JAZZ BRIDGE SINGLE-COIL (Bridge Solo)
# ------------------------------------------------------------------------------

[pickups.p.circuit]
topology = "single"
L = 3.8
Rdc = 10500.0
Reddy = 180000.0
Ccoil = 6e-11
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.j]
name = "60s Jazz Bridge Single-Coil"
position_name = "Bridge"
position_from_bridge_m = 0.0635  # 63.5mm from bridge (14 1/2" from 12th fret)
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "alnico_v"
resonant_frequency_hz = 3200.0   # Bridge single-coil loaded resonance (3.2 kHz)
q_factor = 1.60
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. VINTAGE P/J PARALLEL (Both Volumes 100%)
# ------------------------------------------------------------------------------

[pickups.j.circuit]
topology = "single"
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.pair_parallel]
name = "Vintage P/J Parallel (Both Volumes 100%)"
position_name = "Parallel"
position_from_bridge_m = 0.09425 # Acoustic centroid (125.0mm + 63.5mm) / 2
aperture_width_in = 0.875        # Blended effective aperture
coil_spacing_in = 0.0
type = "composite"
magnet_type = "alnico_v"
resonant_frequency_hz = 2800.0   # Combined parallel equivalent resonance under 125k net vol load
q_factor = 1.20                  # Damped quality factor under dual 250k volume load
components = [
    { pickup = "p", weight = 0.5 },
    { pickup = "j", weight = 0.5 }
]

[pickups.p_active]
name = "Modern Ceramic Split-Coil (Neck)"
position_name = "Split"
position_from_bridge_m = 0.1250
aperture_width_in = 1.00
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "ceramic"
alpha = 0.12
resonant_frequency_hz = 4800.0
q_factor = 1.70
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

[pickups.p_active.circuit]
topology = "single"
L = 4.8
Rdc = 9500.0
Reddy = 110000.0
Ccoil = 8e-11
vsat = 0.4
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[pickups.j_active]
name = "Modern Ceramic Single-Coil (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0635
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "ceramic"
alpha = 0.12
resonant_frequency_hz = 4600.0
q_factor = 1.80
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]

[pickups.j_active.circuit]
topology = "single"
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[pickups.pair_active]
name = "Modern Active P/J (Split P + J Bridge)"
position_name = "Parallel"
position_from_bridge_m = 0.09425
aperture_width_in = 0.875
coil_spacing_in = 0.0
type = "composite"
magnet_type = "ceramic"
resonant_frequency_hz = 4600.0
q_factor = 1.60
components = [
    { pickup = "p_active", weight = 0.5 },
    { pickup = "j_active", weight = 0.5 }
]

[pickups.pair_active.circuit]
topology = "parallel"
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[pickups.pair_active.circuit.neck]
L = 4.8
Rdc = 9500.0
Reddy = 110000.0
Ccoil = 8e-11
vsat = 0.4

[pickups.pair_active.circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest physical pickup state on the P/J Bass:
#   - Neck Solo (P): Precision bass voicings, Mudbucker, and Upright acoustic depth
#   - Bridge Solo (J): 60s Jazz bridge growl, StingRay bite, and Rickenbacker clank
#   - Both Parallel (P/J): Authentic P/J hybrid, scooped Jazz slap, and modern punch


[pickups.pair_parallel.circuit]
topology = "parallel"
Rtop = 10.0
Rbot = 125000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.pair_parallel.circuit.neck]
L = 3.8
Rdc = 10500.0
Reddy = 180000.0
Ccoil = 6e-11

[pickups.pair_parallel.circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11

# ------------------------------------------------------------------------------
# 2. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pair_parallel]
version = 1
name = "Vintage Alnico P/J Parallel"
tone_name = "PJ Passive"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 4.7e-08
gain_db = 0.5

[voicings.pair_active]
version = 1
name = "Modern Active P/J Preamp Boost"
tone_name = "PJ Active"
pickup = "pair_active"
affinity = "parallel"
vol_pos = 1.0
tone_pos = 1.0
gain_db = 1.5
preamp_preset = "sadowsky_2band"

[voicings.p_solo]
version = 1
name = "Solo Vintage Split P"
tone_name = "Precision Vintage"
pickup = "p"
affinity = "neck"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 4.7e-08

[voicings.neck_active]
version = 1
name = "Solo Modern Active Split P"
tone_name = "Precision Active"
pickup = "p_active"
affinity = "neck"
vol_pos = 1.0
tone_pos = 1.0
gain_db = 1.5
preamp_preset = "sadowsky_2band"


[voicings.j_solo]
version = 1
name = "Solo 60s Bridge J"
tone_name = "Jazz Bridge Open"
pickup = "j"
affinity = "bridge"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 4.7e-08

# ------------------------------------------------------------------------------
# 3. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "p"
bridge = "j"
parallel = "pair_parallel"
direct = "pair_parallel"
