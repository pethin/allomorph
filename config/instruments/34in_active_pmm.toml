# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Modern Active P/MM Bass (Sandberg California VM4 / Lakland 44-02 Archetype)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Precision Split-Coil P: Centerline 125.0mm from bridge saddle
#       - E/A half (forward towards neck): 139.0mm from bridge (292.8mm from 12th fret)
#       - D/G half (rearward towards bridge): 111.0mm from bridge (320.8mm from 12th fret)
#       - Aperture width: 0.45" (11.4mm) magnetic sensing aperture per coil half
#   - Music Man Bridge Humbucker: Centerline 66.0mm from bridge saddle (sweet spot)
#       - Forward neck coil: 77.1mm from bridge (354.7mm from 12th fret)
#       - Rearward bridge coil: 54.9mm from bridge (376.9mm from 12th fret) (coil spacing 0.875" / 22.225mm)
#       - Aperture width: 1.25" (31.75mm) dual-coil housing
# Electronics:
#   - Active high-impedance buffer stage (Rin = 1.0 MOhm, Cin = 25 pF, low-Z Rout = 100 Ohm)
#     isolating high-impedance coils from cable capacitance drag.

id = "34in_active_pmm"
name = "34\" Modern Active P/MM Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"
version = 1

string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.split_p]
name = "Precision Split-Coil (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1250
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "alnico_v"
resonant_frequency_hz = 3200.0
q_factor = 1.4
coils = [
    { id = "forward", strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 0.45, pole_type = "rod", L = 2.4, Rdc = 4750.0, Reddy = 110000.0, Ccoil = 4e-11, weight = 1.0 },
    { id = "rearward", strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 0.45, pole_type = "rod", L = 2.4, Rdc = 4750.0, Reddy = 110000.0, Ccoil = 4e-11, weight = 1.0 },
]

[pickups.mm]
name = "Music Man Dual-Coil Parallel (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0660
aperture_width_in = 1.25
coil_spacing_in = 0.875
type = "dual_coil_parallel"
magnet_type = "alnico_v"
resonant_frequency_hz = 3500.0
q_factor = 1.5
coils = [
    { id = "forward", strings = ["all"], position_from_bridge_m = 0.0771, aperture_width_in = 0.45, pole_type = "rod", L = 7.2, Rdc = 14800.0, Reddy = 250000.0, Ccoil = 5.5e-11, weight = 0.5 },
    { id = "rearward", strings = ["all"], position_from_bridge_m = 0.0549, aperture_width_in = 0.45, pole_type = "rod", L = 7.2, Rdc = 14800.0, Reddy = 250000.0, Ccoil = 5.5e-11, weight = 0.5 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Active P/MM Buffer & Blend Harness with Series/Parallel Switch)
# ------------------------------------------------------------------------------

[harnesses.active]
name = "Active P/MM Buffer & Blend Harness"
type = "active_preamp"
preamp_gain = 1.5
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    # Split P coils in series
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],
    ["pickups.split_p.rearward.cold", "GND"],

    # Preamp & Volume
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 250000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.switches.routing]
name = "P/MM Summing Routing"
type = "toggle"
default = "parallel"

[harnesses.active.switches.routing.positions.parallel]
connect = [
    ["pickups.split_p.forward.hot", "controls.blend.neck_in"],
    ["pickups.mm.forward.cold", "GND"],
    ["pickups.mm.rearward.cold", "GND"],
    ["pickups.mm.forward.hot", "controls.blend.bridge_in"],
    ["pickups.mm.rearward.hot", "controls.blend.bridge_in"],
]

[harnesses.active.switches.routing.positions.series]
connect = [
    ["pickups.split_p.forward.hot", "pickups.mm.forward.cold"],
    ["pickups.split_p.forward.hot", "pickups.mm.rearward.cold"],
    ["pickups.mm.forward.hot", "controls.blend.neck_in"],
    ["pickups.mm.rearward.hot", "controls.blend.neck_in"],
]

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.pmm_parallel]
version = 1
name = "Modern Active P/MM Bass (Parallel)"
tone_name = "P∕MM Parallel"
harness = "active"
switches = { routing = "parallel" }
controls = { vol = 1.0, blend = 0.5 }

[voicings.pmm_series]
version = 1
name = "P/MM Hybrid Series Bass"
tone_name = "P∕MM Series"
harness = "active"
switches = { routing = "series" }
controls = { vol = 1.0, blend = 0.5 }

[voicings.p_solo]
version = 1
name = "Solo Active Split-P Neck"
tone_name = "P∕MM P Solo"
harness = "active"
switches = { routing = "parallel" }
controls = { vol = 1.0, blend = 0.0 }

[voicings.mm_solo]
version = 1
name = "Solo MM Bridge Parallel Humbucker"
tone_name = "P∕MM Bridge"
harness = "active"
switches = { routing = "parallel" }
controls = { vol = 1.0, blend = 1.0 }
