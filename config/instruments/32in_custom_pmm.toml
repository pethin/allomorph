# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 32" Medium Scale Custom Bass with Reverse EMG PX and EMG MMTWX (ABCX Active Blend)
# ==============================================================================
# Blueprint Reference: /Users/peter/Projects/pethin/medium-scale-bass/Pickup Placement - P_MM.md
# Physical Datums:
#   - Reverse EMG PX Split: 122.8mm centerline (D/G half @ 136.8mm, E/A half @ 108.8mm)
#   - EMG MMTWX: 62.2mm centerline (Neck coil @ 73.7mm, Bridge coil @ 50.8mm)
# Electronics:
#   - Active 18V EMG ABCX active blend control (op-amp buffered parallel summing, center detent).
#   - MMTWX push/pull on volume pot toggles between single-coil (J mode @ 50.8mm, pushed down) and dual-coil (MM mode, pulled up).
#   - Note: Active pickups cannot be wired in series. All blending is active parallel.

id = "32in_custom_pmm"
name = "32\" Medium Scale Custom (EMG PX + MMTWX)"
scale_length_in = 32.0
scale_length_m = 0.8128
electronics = "active"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [66.98, 89.41, 119.35, 159.31]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with medium-scale nickel roundwounds (D'Addario EXL165M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165M"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 160.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

# Reverse EMG PX Split-Coil:
# D/G coil half mounted forward (towards neck) for fullness,
# E/A coil half mounted backward (towards bridge) for tight low-end definition.
[pickups.px]
name = "Reverse EMG PX Split-Coil (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1228  # Effective centerline (122.8mm)
aperture_width_in = 1.10         # 1.10" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "ceramic"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 2000.0
coils = [
    # Strings 1 & 2 see only forward D/G coil half
    { id = "forward", strings = [1, 2], position_from_bridge_m = 0.1368, aperture_width_in = 0.45, weight = 1.0, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 3.17e-9 },
    # Strings 3 & 4 see only rearward E/A coil half
    { id = "rearward", strings = [3, 4], position_from_bridge_m = 0.1088, aperture_width_in = 0.45, weight = 1.0, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 3.17e-9 },
]

# EMG MMTWX Active Dual-Mode Pickup (Bridge):
# Dual-mode ceramic & steel blades (CSX MM dual coil or JCSX single-coil).
[pickups.mmtwx]
name = "EMG MMTWX Active Dual-Mode Pickup"
position_name = "Bridge"
position_from_bridge_m = 0.0622  # 62.2mm centerline
aperture_width_in = 1.50         # Dual-coil housing aperture
coil_spacing_in = 0.90           # 0.90" (22.86mm) spacing between coil centers
type = "dual_coil_parallel"
magnet_type = "ceramic_steel"
pole_type = "blade"
has_internal_buffer = true
buffer_output_impedance = 2000.0
coils = [
    { id = "neck", strings = ["all"], position_from_bridge_m = 0.0737, aperture_width_in = 0.45, weight = 0.5, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 2.4e-9 },
    { id = "bridge", strings = ["all"], position_from_bridge_m = 0.0508, aperture_width_in = 0.45, weight = 0.5, pole_type = "blade", L = 0.80, Rdc = 2800.0, Reddy = 150000.0, Ccoil = 2.4e-9 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (EMG ABCX Active Blend & Push-Pull Coil Switch)
# ------------------------------------------------------------------------------

[harnesses.active]
name = "EMG ABCX Active Blend Harness with MMTWX Push-Pull"
type = "active_preamp"
load_resistance = 1000000.0
cable_pf = 30.0

wiring = [
    # PX pickup into blend neck_in
    ["pickups.px.hot", "controls.blend.neck_in"],
    ["pickups.px.cold", "GND"],

    # Blend output into master volume
    ["controls.blend.wiper", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.blend]
name = "Pickup Blend"
type = "pot"
taper = "mn_blend"
resistance = 25000.0
default = 0.5

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.switches.coil_mode]
name = "MMTWX Push-Pull Coil Mode"
type = "push_pull"
default = "dual"

[harnesses.active.switches.coil_mode.positions.dual]
connect = [
    ["pickups.mmtwx.neck.hot", "controls.blend.bridge_in"],
    ["pickups.mmtwx.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.mmtwx.neck.cold", "GND"],
    ["pickups.mmtwx.bridge.cold", "GND"],
]
k_mutual = 0.20
components = { "pickups.mmtwx.neck.Ccoil" = 4.86e-9, "pickups.mmtwx.bridge.Ccoil" = 4.86e-9 }

[harnesses.active.switches.coil_mode.positions.single]
connect = [
    ["pickups.mmtwx.bridge.hot", "controls.blend.bridge_in"],
    ["pickups.mmtwx.bridge.cold", "GND"],
    ["pickups.mmtwx.neck.cold", "GND"],
]
k_mutual = 0.0
components = { "pickups.mmtwx.bridge.Ccoil" = 2.68e-9 }

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.px_solo]
version = 1
name = "Solo Reverse EMG PX Split"
tone_name = "Custom PX Solo"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0, blend = 0.0 }

[voicings.mm_single]
version = 1
name = "Solo Bridge MMTWX Single Coil"
tone_name = "Custom MM Single"
harness = "active"
switches = { coil_mode = "single" }
controls = { vol = 1.0, blend = 1.0 }

[voicings.mm_dual]
version = 1
name = "Solo Bridge MMTWX Dual Coil"
tone_name = "Custom MM Dual"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0, blend = 1.0 }

[voicings.blend_parallel]
version = 1
name = "Reverse PX + MMTWX Parallel Detent"
tone_name = "Custom P∕MM Blend"
harness = "active"
switches = { coil_mode = "dual" }
controls = { vol = 1.0, blend = 0.5 }

[voicings.pj_blend]
version = 1
name = "Reverse PX + MMTWX Single (P/J Mode)"
tone_name = "Custom PJ Blend"
harness = "active"
switches = { coil_mode = "single" }
controls = { vol = 1.0, blend = 0.5 }
