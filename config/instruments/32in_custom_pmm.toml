# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 32" Medium Scale Custom Bass with Reverse EMG PX and EMG MMTWX (ABCX Active Blend)
# ==============================================================================
# Blueprint Reference: /Users/peter/Projects/pethin/medium-scale-bass/Pickup Placement - P_MM.md
# Physical Datums:
#   - Reverse EMG PX Split: 122.8mm centerline (D/G half @ 136.8mm, E/A half @ 108.8mm)
#   - EMG MMTWX: 62.2mm centerline (Neck coil @ 73.7mm, Bridge coil @ 50.8mm)
# Electronics:
#   - Active 18V EMG ABCX active blend control (op-amp buffered parallel summing, center detent).
#   - MMTWX push/pull on volume pot toggles between single-coil (J mode @ 50.8mm, pushed down) and dual-coil (MM mode, pulled up).
#   - Note: Active pickups cannot be wired in series. All blending is active parallel.

id = "32in_custom_pmm"
name = "32\" Medium Scale Custom (EMG PX + MMTWX)"
scale_length_in = 32.0
scale_length_m = 0.8128
electronics = "active"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [66.98, 89.41, 119.35, 159.31]

default_pickup = "px"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with medium-scale nickel roundwounds (D'Addario EXL165M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165M"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 160.0

# ------------------------------------------------------------------------------
# 1. REVERSE EMG PX SPLIT-COIL (Neck Solo)
# ------------------------------------------------------------------------------
# Reverse split layout: D/G coil half is mounted forward (towards neck) for fullness,
# while E/A coil half is mounted backward (towards bridge) for tight low-end definition.
[pickups.px]
name = "Reverse EMG PX Split-Coil (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1228  # Effective centerline (122.8mm)
aperture_width_in = 1.10         # 1.10" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
resonant_frequency_hz = 3200.0   # Ceramic active X-series resonance (from EMG datasheet)
q_factor = 1.40
coils = [
    # Strings 1 & 2 see only the forward D/G coil half
    { strings = [1, 2], position_from_bridge_m = 0.1368, aperture_width_in = 1.10, weight = 1.0 },
    # Strings 3 & 4 see only the rearward E/A coil half
    { strings = [3, 4], position_from_bridge_m = 0.1088, aperture_width_in = 1.10, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. EMG MMTWX SINGLE-COIL (Bridge Solo - Push/Pull Down: J Mode)
# ------------------------------------------------------------------------------
# Active single-coil mode using bridge-side stacked coils (L2+L3) at 50.8mm (2.0" from bridge).
# Selected when MMTWX volume pot is pushed down.
[pickups.mmtwx_single]
name = "EMG MMTWX Single-Coil (Bridge)"
position_name = "Single"
position_from_bridge_m = 0.0508  # 50.8mm from bridge (2.0")
aperture_width_in = 0.75         # Narrow 0.75" Jazz bridge aperture
coil_spacing_in = 0.0
type = "single_coil"
resonant_frequency_hz = 3500.0   # High single-coil active resonance
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0508, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. EMG MMTWX DUAL-COIL (Bridge Solo - Push/Pull Up: MM Mode)
# ------------------------------------------------------------------------------
# Humbucking Music Man mode superimposing neck coil (73.7mm) and bridge coil (50.8mm).
# Selected when MMTWX volume pot is pulled up.
[pickups.mmtwx_dual]
name = "EMG MMTWX Dual-Coil (Centerline)"
position_name = "Dual"
position_from_bridge_m = 0.0622  # 62.2mm centerline (2.45")
aperture_width_in = 1.50         # Dual-coil housing aperture
coil_spacing_in = 0.90           # 0.90" (22.86mm) spacing between coil centers
type = "dual_coil_parallel"
resonant_frequency_hz = 2500.0   # Active dual-coil resonance
q_factor = 1.35
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0737, aperture_width_in = 0.75, weight = 0.5 }, # Neck coil
    { strings = ["all"], position_from_bridge_m = 0.0508, aperture_width_in = 0.75, weight = 0.5 }  # Bridge coil
]

# ------------------------------------------------------------------------------
# 4. ACTIVE PARALLEL P/MM BLEND (EMG ABCX Center Detent - Push/Pull Up: MM Mode)
# ------------------------------------------------------------------------------
# Op-amp buffered 50/50 parallel summation of Reverse PX and MMTWX dual-coil.
# Results in a compound 3-coil array (Reverse P split + MM dual coils).
[pickups.blend_parallel]
name = "EMG PX + MMTWX Parallel (P/MM Mode)"
position_name = "P/MM"
position_from_bridge_m = 0.0868  # Acoustic centroid
aperture_width_in = 0.88
coil_spacing_in = 0.0
type = "composite"
resonant_frequency_hz = 2850.0   # Active composite resonance
q_factor = 1.38
components = [
    { pickup = "px", weight = 0.5 },
    { pickup = "mmtwx_dual", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 5. ACTIVE PARALLEL P/J BLEND (EMG ABCX Center Detent - Push/Pull Down: J Mode)
# ------------------------------------------------------------------------------
# Op-amp buffered 50/50 parallel summation of Reverse PX and MMTWX single-coil.
# Results in an authentic 2-pickup P/J sensing array (Reverse P split + J bridge @ 50.8mm).
[pickups.pj_blend_parallel]
name = "EMG PX + MMTWX Single Parallel (P/J Mode)"
position_name = "P/J"
position_from_bridge_m = 0.0868  # Acoustic centroid
aperture_width_in = 0.88
coil_spacing_in = 0.0
type = "composite"
resonant_frequency_hz = 3350.0   # Active composite resonance (3.2 kHz PX + 3.5 kHz J)
q_factor = 1.40
components = [
    { pickup = "px", weight = 0.5 },
    { pickup = "mmtwx_single", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 6. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.px_solo]
version = 1
name = "Solo Reverse EMG PX Split"
tone_name = "Custom PX Solo"
pickup = "px"
affinity = "neck"
vol_pos = 1.0

[voicings.mm_single]
version = 1
name = "Solo Bridge MMTWX Single Coil"
tone_name = "Custom MM Single"
pickup = "mmtwx_single"
affinity = "bridge"
vol_pos = 1.0

[voicings.mm_dual]
version = 1
name = "Solo Bridge MMTWX Dual Coil"
tone_name = "Custom MM Dual"
pickup = "mmtwx_dual"
affinity = "bridge"
vol_pos = 1.0

[voicings.blend_parallel]
version = 1
name = "Reverse PX + MMTWX Parallel Detent"
tone_name = "Custom P∕MM Blend"
pickup = "blend_parallel"
affinity = "parallel"
vol_pos = 1.0

[voicings.pj_blend]
version = 1
name = "Reverse PX + MMTWX Single (P/J Mode)"
tone_name = "Custom PJ Blend"
pickup = "pj_blend_parallel"
affinity = "parallel"
vol_pos = 1.0

# ------------------------------------------------------------------------------
# 7. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "px"
bridge = "mmtwx_single"
parallel = "blend_parallel"
direct = "px"
pj_active = "pj_blend_parallel"
pj_passive = "pj_blend_parallel"
"34in_standard_pj:pair_parallel" = "pj_blend_parallel"
"34in_standard_pj:pair_active" = "pj_blend_parallel"
stingray_parallel = "mmtwx_dual"
stingray_series = "mmtwx_dual"
stingray_active = "mmtwx_dual"
"34in_active_stingray:parallel_classic" = "mmtwx_dual"
"34in_active_stingray:series_punch" = "mmtwx_dual"
"34in_active_stingray:active_slap" = "mmtwx_dual"
