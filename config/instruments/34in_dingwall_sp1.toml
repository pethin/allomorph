# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 32"-35" Dingwall SP1 5-String (Ready-to-Play Super P Multi-Scale)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 32"-35" Super Multi-Scale (35.0" low B, 32.0" high G)
#   - Transverse Wave Speeds: 54.88 m/s (B) to 159.31 m/s (G)
#   - Dual-P Neck Split-Coil (DPn): Centerline 125.0mm from bridge saddle
#       - B/E/A bass half (forward towards neck): 138.0mm from bridge
#       - D/G treble half (rearward towards bridge): 112.0mm from bridge
#       - Aperture width: 0.45" (11.4mm) per coil half
#   - FD3n Bridge Single/Dual Coil: Centerline 58.0mm from bridge saddle
#   - Parallel Summing (Dual-P + FD3n): Centerline 91.5mm from bridge saddle
# Electronics:
#   - Passive Quad-Tone 4-way rotary selector, 250k volume, 250k tone (47nF cap).

id = "34in_dingwall_sp1"
name = "Dingwall SP1 5-String (32\"-35\" Super P)"
scale_length_in = 35.0
scale_length_m = 0.889
scale_min_in = 32.0
scale_max_in = 35.0
is_multiscale = true
electronics = "passive"
version = 1

# String wave speeds for 32"-35" Super multi-scale (B0, E1, A1, D2, G2)
string_wave_speeds = [54.88, 71.69, 93.60, 122.14, 159.31]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with Dingwall Super Series custom-scale nickel roundwounds (5-string).
[strings]
preset = "roundwound_nickel_standard"
brand = "Dingwall"
model = "Super Series Custom 5-String"
gauge = "45-130"
core = "hex"
wrap = "nickel_round"
tension_lbs = 205.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.split_p]
name = "Dingwall Dual-P Neodymium (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1250  # Centerline 125.0mm
aperture_width_in = 0.45         # 0.45" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "neodymium"
coils = [
    # Strings 3, 4 & 5 see forward coil half
    { id = "forward", strings = [3, 4, 5], position_from_bridge_m = 0.1380, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 180000.0, Ccoil = 3e-11, weight = 0.5 },
    # Strings 1 & 2 see rearward coil half
    { id = "rearward", strings = [1, 2], position_from_bridge_m = 0.1120, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 180000.0, Ccoil = 3e-11, weight = 0.5 },
]

[pickups.bridge]
name = "Dingwall FD3n Neodymium (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0580  # Bridge placement 58.0mm
aperture_width_in = 0.45
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "neodymium"
coils = [
    # Reverse split-P: treble strings (1, 2) forward half, bass strings (3, 4, 5) rearward half
    { id = "forward", strings = [1, 2], position_from_bridge_m = 0.06625, aperture_width_in = 0.40, pole_type = "rod", L = 1.15, Rdc = 2200.0, Reddy = 150000.0, Ccoil = 6e-11, weight = 0.5 },
    { id = "rearward", strings = [3, 4, 5], position_from_bridge_m = 0.04975, aperture_width_in = 0.40, pole_type = "rod", L = 1.15, Rdc = 2200.0, Reddy = 150000.0, Ccoil = 6e-11, weight = 0.5 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Dingwall Quad-Tone 4-Way Rotary Selector & Passive Controls)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "Dingwall Quad-Tone Passive Harness"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0

wiring = [
    # Split P coils in series
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],

    # Bridge coils in series
    ["pickups.bridge.forward.cold", "pickups.bridge.rearward.hot"],

    # Master volume and tone
    ["bus", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
    ["bus", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
]

[harnesses.passive.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 250000.0
cap = 4.7e-8
default = 1.0

[harnesses.passive.switches.rotary]
name = "Quad-Tone 4-Way Rotary Selector"
type = "rotary"
default = "parallel"

[harnesses.passive.switches.rotary.positions.bridge]
connect = [
    ["pickups.bridge.rearward.cold", "GND"],
    ["pickups.bridge.forward.hot", "bus"],
]

[harnesses.passive.switches.rotary.positions.parallel]
connect = [
    ["pickups.bridge.rearward.cold", "GND"],
    ["pickups.bridge.forward.hot", "bus"],
    ["pickups.split_p.rearward.cold", "GND"],
    ["pickups.split_p.forward.hot", "bus"],
]

[harnesses.passive.switches.rotary.positions.series]
connect = [
    ["pickups.bridge.rearward.cold", "GND"],
    ["pickups.bridge.forward.hot", "pickups.split_p.rearward.cold"],
    ["pickups.split_p.forward.hot", "bus"],
]

[harnesses.passive.switches.rotary.positions.neck]
connect = [
    ["pickups.split_p.rearward.cold", "GND"],
    ["pickups.split_p.forward.hot", "bus"],
]

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.super_p_parallel]
version = 1
name = "Dingwall Super P + Bridge Parallel"
tone_name = "Dingwall SP1 Parallel"
harness = "passive"
switches = { rotary = "parallel" }
controls = { vol = 1.0, tone = 1.0 }

[voicings.super_p_series]
version = 1
name = "Dingwall Super P + Bridge Series Wall of Sound"
tone_name = "Dingwall SP1 Series"
harness = "passive"
switches = { rotary = "series" }
controls = { vol = 1.0, tone = 1.0 }

[voicings.super_p_solo]
version = 1
name = "Dingwall Super P Solo Split"
tone_name = "Dingwall Super P"
harness = "passive"
switches = { rotary = "neck" }
controls = { vol = 1.0, tone = 1.0 }

[voicings.super_bridge_solo]
version = 1
name = "Dingwall FD3 Solo Bridge"
tone_name = "Dingwall SP1 Bridge"
harness = "passive"
switches = { rotary = "bridge" }
controls = { vol = 1.0, tone = 1.0 }
