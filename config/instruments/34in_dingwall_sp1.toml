# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 32"-35" Dingwall SP1 5-String (Ready-to-Play Super P Multi-Scale)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 32"-35" Super Multi-Scale (35.0" low B, 32.0" high G)
#   - Transverse Wave Speeds: 54.88 m/s (B) to 159.31 m/s (G)
#   - Dual-P Neck Split-Coil (DPn): Centerline 125.0mm from bridge saddle
#       - B/E/A bass half (forward towards neck): 138.0mm from bridge
#       - D/G treble half (rearward towards bridge): 112.0mm from bridge
#       - Aperture width: 1.00" (25.4mm) per coil half
#   - FD3n Bridge Single/Dual Coil: Centerline 58.0mm from bridge saddle
#   - Parallel Summing (Dual-P + FD3n): Centerline 91.5mm from bridge saddle
# Electronics:
#   - Passive Quad-Tone 4-way rotary selector, 250k volume, 250k tone (47nF cap).
#   - Dual-P loaded resonance: 3.20 kHz, Q = 1.35 under 750pF cable load.
#   - FD3n Bridge loaded resonance: 3.60 kHz, Q = 1.45 under 750pF cable load.
#   - Parallel loaded resonance: 3.40 kHz, Q = 1.30.

id = "34in_dingwall_sp1"
name = "Dingwall SP1 5-String (32\"-35\" Super P)"
scale_length_in = 35.0
scale_length_m = 0.889
scale_min_in = 32.0
scale_max_in = 35.0
is_multiscale = true
electronics = "passive"
version = 1

# String wave speeds for 32"-35" Super multi-scale (B0, E1, A1, D2, G2)
string_wave_speeds = [54.88, 71.69, 93.60, 122.14, 159.31]

default_pickup = "p"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with Dingwall Super Series custom-scale nickel roundwounds (5-string).
[strings]
preset = "roundwound_nickel_standard"
brand = "Dingwall"
model = "Super Series Custom 5-String"
gauge = "45-130"
core = "hex"
wrap = "nickel_round"
tension_lbs = 205.0

# ------------------------------------------------------------------------------
# 1. DINGWALL DUAL-P NEODYMIUM SPLIT-COIL (Neck Solo - Rotary Pos 4)
# ------------------------------------------------------------------------------
[pickups.p]
name = "Dingwall Dual-P Neodymium (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1250  # Centerline 125.0mm
aperture_width_in = 1.00         # 1.00" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "neodymium"
resonant_frequency_hz = 3200.0   # Loaded resonance
q_factor = 1.35
coils = [
    # Strings 3, 4 & 5 see forward coil half
    { strings = [3, 4, 5], position_from_bridge_m = 0.1380, aperture_width_in = 1.00, weight = 1.0 },
    # Strings 1 & 2 see rearward coil half
    { strings = [1, 2], position_from_bridge_m = 0.1120, aperture_width_in = 1.00, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. DINGWALL FD3n BRIDGE PICKUP (Bridge Solo - Rotary Pos 1)
# ------------------------------------------------------------------------------

[pickups.p.circuit]
topology = "single"
L = 3.8
Rdc = 10500.0
Reddy = 180000.0
Ccoil = 6e-11
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.bridge]
name = "Dingwall FD3n Neodymium (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0580  # Bridge placement 58.0mm
aperture_width_in = 0.85
coil_spacing_in = 0.65
type = "dual_coil_parallel"
magnet_type = "neodymium"
resonant_frequency_hz = 3600.0
q_factor = 1.45
coils = [
    { strings = ["all"], position_from_bridge_m = 0.06625, aperture_width_in = 0.65, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.04975, aperture_width_in = 0.65, weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 3. DINGWALL DUAL-P + BRIDGE PARALLEL (Rotary Pos 2)
# ------------------------------------------------------------------------------

[pickups.bridge.circuit]
topology = "single"
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.pair_parallel]
name = "Dingwall Dual-P + Bridge Parallel"
position_name = "Parallel"
position_from_bridge_m = 0.0915  # Centroid 91.5mm
aperture_width_in = 0.85
coil_spacing_in = 0.0
type = "composite"
magnet_type = "neodymium"
resonant_frequency_hz = 3400.0
q_factor = 1.30
components = [
    { pickup = "p", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest rotary switch position on the SP1:
#   - Pos 4: Dual-P Solo (Precision Bass, Mudbucker, Upright)
#   - Pos 2: Dual-P + Bridge Parallel (Jazz Bass pair, Modern P/J, Vintage P/J, P/MM)
#   - Pos 1: FD3n Bridge Solo (60s Jazz Bridge, StingRay, Rickenbacker, Multi-Scale)


[pickups.pair_parallel.circuit]
topology = "parallel"
Rtop = 10.0
Rbot = 125000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[pickups.pair_parallel.circuit.neck]
L = 3.8
Rdc = 10500.0
Reddy = 180000.0
Ccoil = 6e-11

[pickups.pair_parallel.circuit.bridge]
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10

# ------------------------------------------------------------------------------
# 2. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.super_p_parallel]
version = 1
name = "Dingwall Super P + Bridge Parallel"
tone_name = "Dingwall SP1 Parallel"
pickup = "pair_parallel"
affinity = "parallel"
vol_pos = 1.0

[voicings.super_p_solo]
version = 1
name = "Dingwall Super P Solo Split"
tone_name = "Dingwall Super P"
pickup = "p"
affinity = "neck"
vol_pos = 1.0

[voicings.super_bridge_solo]
version = 1
name = "Dingwall FD3 Solo Bridge"
tone_name = "Dingwall SP1 Bridge"
pickup = "bridge"
affinity = "bridge"
vol_pos = 1.0

# ------------------------------------------------------------------------------
# 3. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "p"
bridge = "bridge"
parallel = "pair_parallel"
direct = "pair_parallel"
