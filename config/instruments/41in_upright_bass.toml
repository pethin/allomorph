# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 41.25" 3/4 Acoustic Upright Double Bass (Spruce Top, Maple Back)
# ==============================================================================

id = "41in_upright_bass"
name = "41.25\" Acoustic Double Bass"
scale_length_in = 41.25
scale_length_m = 1.04775
electronics = "piezo"
version = 1

string_wave_speeds = [86.33, 115.25, 153.86, 205.36]

[strings]
preset = "double_bass_spirocore"
brand = "Thomastik-Infeld"
model = "Spirocore Medium 4-String"
gauge = "Standard 3/4"
core = "spiral_rope"
wrap = "chrome_steel_flat"
tension_lbs = 240.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCERS (Single physical pickups mounted in wood)
# ------------------------------------------------------------------------------

[pickups.bridge_piezo]
name = "Underwood / Realist Acoustic Bridge Wing Transducer"
position_name = "Bridge"
position_from_bridge_m = 0.0050  # Saddle / bridge wing contact point (5mm)
aperture_width_in = 0.25
coil_spacing_in = 0.0
type = "piezo_bridge"
magnet_type = "piezo"
coils = [
    { id = "piezo", strings = ["all"], position_from_bridge_m = 0.0050, aperture_width_in = 0.25, weight = 1.0, L = 1e-06, Rdc = 50.0, Reddy = 1000000.0, Ccoil = 1.2e-09 }
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Direct Sensor Output)
# ------------------------------------------------------------------------------

[harnesses.direct]
name = "Direct Piezo Output"
type = "direct"

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.bridge_piezo]
version = 1
name = "Acoustic Double Bass Bridge Piezo Force"
tone_name = "Upright Piezo"
harness = "direct"
sensor_type = "bridge_force"
string_preset_override = "double_bass_spirocore"
