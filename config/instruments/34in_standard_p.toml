# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Precision Bass (Single Split-Coil P)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Standard Fender Split-Coil P: Centerline 125.0mm from bridge saddle
#       - E/A half (forward towards neck): 139.0mm from bridge (292.8mm from 12th fret)
#       - D/G half (rearward towards bridge): 111.0mm from bridge (320.8mm from 12th fret)
#       - Aperture width: 1.00" (25.4mm) per coil half
# Electronics:
#   - Passive high-impedance circuit: 250k volume pot, 250k tone pot, 47nF capacitor.
#   - Output: High-impedance passive 1/4" jack direct to audio interface / Anagram Block 1.
#   - Loaded electrical resonance: 2.80 kHz, Q = 1.40.

id = "34in_standard_p"
name = "34\" Standard P-Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

default_pickup = "split_p"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard nickel roundwounds (D'Addario EXL165 / Fender 7250M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. STANDARD FENDER SPLIT-COIL P
# ------------------------------------------------------------------------------
[pickups.split_p]
name = "Standard Split-Coil P"
position_name = "Split"
bundle_name = "split_p"
position_from_bridge_m = 0.1250  # Centerline 125.0mm
aperture_width_in = 1.00         # 1.00" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "alnico_v"
resonant_frequency_hz = 2800.0   # Standard Fender split-coil loaded resonance (2.8 kHz)
q_factor = 1.40                  # Vintage Alnico V loaded Q factor
coils = [
    # Strings 3 & 4 see forward coil half (warmer, deeper fundamental)
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    # Strings 1 & 2 see rearward coil half (tighter, punchier mid bite)
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

[pickups.split_p.circuit]
topology = "single"
L = 3.8
Rdc = 10500.0
Reddy = 180000.0
Ccoil = 6e-11
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7e-08

# ------------------------------------------------------------------------------
# 2. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.vintage_open]
version = 1
name = "Vintage 1962 Open"
tone_name = "Precision Vintage"
pickup = "split_p"
affinity = "neck"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 4.7e-08
string_preset_override = "roundwound_nickel_standard"

[voicings.vintage_mids]
version = 1
name = "Vintage 1962 Vocal Mids"
tone_name = "Precision Mids"
pickup = "split_p"
affinity = "neck"
vol_pos = 1.0
tone_pos = 1.0
tone_cap_f = 2.2e-08
Rtone = 3.3
gain_db = 0.5
string_preset_override = "roundwound_nickel_standard"

[voicings.vintage_warm]
version = 1
name = "Vintage Motown Flatwound Warmth"
tone_name = "Precision Warm"
pickup = "split_p"
affinity = "neck"
vol_pos = 1.0
tone_pos = 0.0
tone_cap_f = 4.7e-08
Rtone = 3.3
gain_db = -0.1
string_preset_override = "flatwound_vintage_heavy"



[voicings.slab_dub]
version = 1
name = "1951 Slab Sub-Bass Dub"
tone_name = "Precision Dub"
pickup = "split_p"
affinity = "neck"
vol_pos = 1.0
tone_pos = 0.0
tone_cap_f = 1.0e-07
Rtone = 3.3
gain_db = -0.5
string_preset_override = "flatwound_vintage_heavy"

# ------------------------------------------------------------------------------
# 3. PICKUP AFFINITY ROUTING
# ------------------------------------------------------------------------------
[pickup_mapping]
neck = "split_p"
bridge = "split_p"
parallel = "split_p"
direct = "split_p"
