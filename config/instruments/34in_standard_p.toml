# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Precision Bass (Single Split-Coil P)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Standard Fender Split-Coil P: Centerline 125.0mm from bridge saddle
#       - E/A half (forward towards neck): 139.0mm from bridge (292.8mm from 12th fret)
#       - D/G half (rearward towards bridge): 111.0mm from bridge (320.8mm from 12th fret)
#       - Aperture width: 0.45" (11.4mm) magnetic sensing aperture per coil half

id = "34in_standard_p"
name = "34\" Standard P-Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCER (Physical Split-Coil P mounted in body)
# ------------------------------------------------------------------------------
[pickups.split_p]
name = "Standard Split-Coil P"
position_name = "Split"
position_from_bridge_m = 0.1250  # Centerline 125.0mm
aperture_width_in = 0.45         # 0.45" magnetic sensing aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
magnet_type = "alnico_v"
coils = [
    # Strings 3 & 4 see forward coil half (warmer, deeper fundamental)
    { id = "forward", strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 90000.0, Ccoil = 3e-11, weight = 1.0 },
    # Strings 1 & 2 see rearward coil half (tighter, punchier mid bite)
    { id = "rearward", strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 0.45, pole_type = "rod", L = 1.9, Rdc = 5250.0, Reddy = 90000.0, Ccoil = 3e-11, weight = 1.0 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESSES (Multi-Harness: Passive 1V/1T and Active 2-Band Preamp)
# ------------------------------------------------------------------------------

[harnesses.passive]
name = "Standard P-Bass Passive 1V/1T"
type = "passive"
load_resistance = 1000000.0
cable_pf = 750.0
wiring = [
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],
    ["pickups.split_p.rearward.cold", "GND"],
    ["pickups.split_p.forward.hot", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
    ["controls.vol.in", "controls.tone.in"],
    ["controls.tone.gnd", "GND"],
]

[harnesses.passive.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 250000.0
default = 1.0

[harnesses.passive.controls.tone]
name = "Master Tone"
type = "pot"
taper = "audio_15"
resistance = 250000.0
cap = 4.7e-8
default = 1.0

[harnesses.active]
name = "Sadowsky 2-Band Active Preamp"
type = "active_preamp"
preamp = "sadowsky_2band"
load_resistance = 1000000.0
cable_pf = 30.0
wiring = [
    ["pickups.split_p.forward.cold", "pickups.split_p.rearward.hot"],
    ["pickups.split_p.rearward.cold", "GND"],
    ["pickups.split_p.forward.hot", "preamp.in"],
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.controls.bass]
name = "Bass Boost"
type = "preamp_band"
band = "bass"
default = 0.5

[harnesses.active.controls.treble]
name = "Treble Boost"
type = "preamp_band"
band = "treble"
default = 0.5

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------

[voicings.vintage_open]
version = 1
name = "Vintage 1962 Open"
tone_name = "Precision Vintage"
harness = "passive"
controls = { vol = 1.0, tone = 1.0 }
string_preset_override = "roundwound_nickel_standard"

[voicings.vintage_mids]
version = 1
name = "Vintage 1962 Vocal Mids"
tone_name = "Precision Mids"
harness = "passive"
controls = { vol = 1.0, tone = 0.0 }
components = { "controls.tone.cap" = 2.2e-8 }
string_preset_override = "roundwound_nickel_standard"

[voicings.vintage_warm]
version = 1
name = "Vintage Motown Flatwound Warmth"
tone_name = "Precision Warm"
harness = "passive"
controls = { vol = 1.0, tone = 0.0 }
components = { "controls.tone.cap" = 4.7e-8 }
string_preset_override = "flatwound_vintage_heavy"

[voicings.slab_dub]
version = 1
name = "1951 Slab Sub-Bass Dub"
tone_name = "Precision Dub"
harness = "passive"
controls = { vol = 1.0, tone = 0.0 }
components = { "controls.tone.cap" = 1.0e-7 }
string_preset_override = "flatwound_vintage_heavy"

[voicings.modern_active]
version = 1
name = "Modern Sadowsky Active P-Bass"
tone_name = "Precision Active"
harness = "active"
controls = { vol = 1.0, bass = 0.5, treble = 0.5 }
