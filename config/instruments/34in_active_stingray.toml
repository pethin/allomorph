# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Active Music Man StingRay / Sterling Ray4 / Ray34
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Bridge Sweet Spot: Humbucker centerline 66.0mm from bridge saddle (365.8mm from 12th fret)
#   - Coil Geometry: Dual-coil humbucker (0.875" coil spacing, 1.25" sensing aperture)
#       - Neck coil: 77.1mm from bridge (354.7mm from 12th fret)
#       - Bridge coil: 54.9mm from bridge (376.9mm from 12th fret)
#       - Oversized 3/8" (9.5mm) Alnico V pole pieces
# Electronics:
#   - Active 9V/18V onboard 2-band boost/cut preamp buffer (stingray_2band).
#   - Low output impedance (< 1.0 kOhm) direct to output jack / Anagram Block 1.

id = "34in_active_stingray"
name = "34\" Active StingRay (Music Man MM)"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"
version = 1

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]


# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
[strings]
preset = "roundwound_nickel_standard"
brand = "Ernie Ball"
model = "Regular Slinky"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. HARDWARE TRANSDUCER (Physical Music Man MM Humbucker)
# ------------------------------------------------------------------------------
[pickups.mm_humbucker]
name = "Music Man MM Humbucker"
position_name = "Bridge"
position_from_bridge_m = 0.0660  # Sweet spot centerline 66.0mm
aperture_width_in = 1.25         # 1.25" sensing aperture envelope
coil_spacing_in = 0.875          # 0.875" (22.225mm) spacing between coil centers
type = "dual_coil"
magnet_type = "alnico_v"
coils = [
    { id = "neck", position_from_bridge_m = 0.0771, aperture_width_in = 0.45, pole_type = "rod", L = 2.4, Rdc = 4400.0, Reddy = 75000.0, Ccoil = 1.8e-10, weight = 0.5 },
    { id = "bridge", position_from_bridge_m = 0.0549, aperture_width_in = 0.45, pole_type = "rod", L = 2.4, Rdc = 4400.0, Reddy = 75000.0, Ccoil = 1.8e-10, weight = 0.5 },
]

# ------------------------------------------------------------------------------
# 2. CONTROL HARNESS (Active 2-Band Preamp with Series/Parallel Coil Switch)
# ------------------------------------------------------------------------------
[harnesses.active]
name = "StingRay 2-Band Active Preamp"
type = "active_preamp"
preamp = "stingray_2band"
load_resistance = 1000000.0
cable_pf = 30.0
wiring = [
    ["preamp.out", "controls.vol.in"],
    ["controls.vol.wiper", "out"],
    ["controls.vol.gnd", "GND"],
]

[harnesses.active.controls.vol]
name = "Master Volume"
type = "pot"
taper = "audio_15"
resistance = 25000.0
default = 1.0

[harnesses.active.switches.coil_mode]
name = "Coil Mode Switch"
type = "toggle"
default = "parallel"

[harnesses.active.switches.coil_mode.positions.parallel]
connect = [
    ["pickups.mm_humbucker.neck.hot", "preamp.in"],
    ["pickups.mm_humbucker.bridge.hot", "preamp.in"],
    ["pickups.mm_humbucker.neck.cold", "GND"],
    ["pickups.mm_humbucker.bridge.cold", "GND"],
]
k_mutual = 0.20

[harnesses.active.switches.coil_mode.positions.series]
connect = [
    ["pickups.mm_humbucker.neck.hot", "preamp.in"],
    ["pickups.mm_humbucker.neck.cold", "pickups.mm_humbucker.bridge.hot"],
    ["pickups.mm_humbucker.bridge.cold", "GND"],
]
k_mutual = 0.20

# ------------------------------------------------------------------------------
# 3. NATIVE INSTRUMENT VOICINGS
# ------------------------------------------------------------------------------
[voicings.parallel_classic]
version = 1
name = "Classic 1979 2-Band Parallel Authority"
tone_name = "StingRay Parallel"
harness = "active"
switches = { coil_mode = "parallel" }
controls = { vol = 1.0 }

[voicings.series_punch]
version = 1
name = "High-Output Muscular Series Punch"
tone_name = "StingRay Series"
harness = "active"
switches = { coil_mode = "series" }
controls = { vol = 1.0 }
