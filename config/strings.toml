# ==============================================================================
# ALLOMORPH PHYSICAL STRING CATALOG
# ==============================================================================
# Defines physical properties of string sets used across source instruments
# and target voicings. These parameters govern high-frequency mechanical damping,
# inharmonicity/tension class, dynamic bridge compliance, and tension compliance.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Electric Standard Nickel Roundwounds (Global Default Baseline)
# ------------------------------------------------------------------------------
# The worldwide industry baseline for electric bass (e.g. D'Addario EXL165/170,
# Ernie Ball Slinky .045-.105). Balanced tension, bright harmonic extension.
[strings.roundwound_nickel_standard]
name = "Standard Nickel Roundwound (.045-.105)"
type = "roundwound"
wrap = "nickel"
core = "hex"
tension_lbs = 155.0
damping_cutoff_hz = 8500.0
damping_order = 1.0
k_long = 0.20

# ------------------------------------------------------------------------------
# 1b. Electric Standard Nickel Roundwounds 5-String (Extended Low B Baseline)
# ------------------------------------------------------------------------------
# Universal 5-string industry baseline (.045-.130: D'Addario EXL170-5, Ernie Ball
# Regular Slinky Bass5 2836). Spans Low B0 to High G2 with identical alloy and wrap
# acoustics as standard 4-string nickel roundwounds (8.5 kHz damping cutoff,
# k_long = 0.20) at balanced 195 lbs total tension.
[strings.roundwound_nickel_5string]
name = "Standard Nickel Roundwound 5-String (.045-.130)"
type = "roundwound"
wrap = "nickel"
core = "hex"
tension_lbs = 195.0
damping_cutoff_hz = 8500.0
damping_order = 1.0
k_long = 0.20

# ------------------------------------------------------------------------------
# 1c. Electric Standard Nickel Roundwounds 6-String (Extended Register Baseline)
# ------------------------------------------------------------------------------
# Universal 6-string industry baseline (.032-.130: D'Addario EXL170-6, Ernie Ball
# Slinky 6-String 2838). Spans Low B0 to High C3 with identical alloy and wrap
# acoustics as standard 4-string nickel roundwounds (8.5 kHz damping cutoff,
# k_long = 0.20) at balanced 230 lbs total tension.
[strings.roundwound_nickel_6string]
name = "Standard Nickel Roundwound 6-String (.032-.130)"
type = "roundwound"
wrap = "nickel"
core = "hex"
tension_lbs = 230.0
damping_cutoff_hz = 8500.0
damping_order = 1.0
k_long = 0.20

# ------------------------------------------------------------------------------
# 2. Electric Stainless Steel Roundwounds (Dingwall / Modern Clank)
# ------------------------------------------------------------------------------
# High-tension stainless steel strings (Dingwall Custom .045-.130) with extended
# metallic clank and harmonic brilliance up to 12 kHz.
[strings.roundwound_stainless_clank]
name = "Stainless Steel Multi-Scale Roundwound (.045-.130)"
type = "roundwound"
wrap = "stainless"
core = "hex"
tension_lbs = 180.0
damping_cutoff_hz = 12000.0
damping_order = 1.0
k_long = 0.35

# ------------------------------------------------------------------------------
# 3. La Bella Low Tension Flats (Fretless / Smooth Thump)
# ------------------------------------------------------------------------------
# Flexible round core wrapped in smooth stainless steel ribbon (LTF-4A .043-.100).
# Low tension (~132 lbs total) yields large string excursion, reduced fretless
# fingerboard click, early viscoelastic damping, and warm fundamental tone.
[strings.flatwound_low_tension]
name = "La Bella Low Tension Flats LTF-4A (.043-.100)"
type = "flatwound"
wrap = "stainless_flat"
core = "round"
tension_lbs = 132.0
damping_cutoff_hz = 2800.0
damping_order = 1.8
k_long = 0.08

# ------------------------------------------------------------------------------
# 4. Vintage Deep Flatwounds (Motown / Jamerson 1954 Style)
# ------------------------------------------------------------------------------
# Heavy gauge classic flatwounds (La Bella 760M .052-.110). Massive string mass,
# extremely high tension, rapid harmonic decay, deep pillowy sub fundamental.
[strings.flatwound_vintage_heavy]
name = "Heavy Vintage Flatwound (.052-.110)"
type = "flatwound"
wrap = "stainless_flat"
core = "hex"
tension_lbs = 195.0
damping_cutoff_hz = 1800.0
damping_order = 2.0
k_long = 0.05

# ------------------------------------------------------------------------------
# 5. Upright 3/4 Double Bass Strings (Spirocore / Helicore Orchestral/Pizz)
# ------------------------------------------------------------------------------
# 41.5" Scale spiral steel rope-core double bass strings (Thomastik-Infeld
# Spirocore Medium / D'Addario Helicore Pizzicato). Massive tension, coupled maple bridge
# mechanical damping, high wave speed, and pure harmonicity.
[strings.double_bass_spirocore]
name = "3/4 Double Bass Spiral Rope-Core (Spirocore / Helicore Pizzicato)"
type = "double_bass"
wrap = "chrome_steel"
core = "spiral_rope"
tension_lbs = 265.0              # Massive 41.5" acoustic string tension
damping_cutoff_hz = 3800.0       # Coupled spruce soundboard acoustic damping
damping_order = 2.0
k_long = 0.02
