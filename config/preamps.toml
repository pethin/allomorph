# ------------------------------------------------------------------------------
# 9. Studio Super Inverse Pre-Conditioner (`studio_super_driver`)
# ------------------------------------------------------------------------------
# Shared onboard FET buffer & inverse pre-conditioning preamp for 35in_studio_super.
# Default bands are hardware-calibrated via Darkglass Anagram re-amping for Chain #1:
# Ampeg SVT-CL (`Peggy Classic`) + Heritage 8x10 (`Vintage Peggy 8x10`) + `Dynamic 421` (`Cone On Axis`);
# individual rig voicings (#2-#10) override `preamp_bands` directly on each voicing:
#   - Anchors 56 Hz sub-fundamental against Vintage 8x10 infinite-baffle roll-off (+2.8 dB @ 56 Hz, Q=1.3)
#   - Tames 84 Hz Vintage 8x10 "fridge thump" chamber resonance (-2.4 dB @ 84 Hz, Q=2.0)
#   - Drives 340 Hz low-mid note authority and 6550 tube harmonics (+5.2 dB, Q=0.85)
#   - Lifts 960 Hz midrange pocket (+5.4 dB, Q=1.0) against the SVT's -23.9 dB @ 900-1050 Hz scoop
#   - Drives 1950 Hz upper-mid articulation (+5.8 dB, Q=1.05) into the Dynamic 421 Cone On-Axis + 10" cone window
[preamps.studio_super_driver]
id = "studio_super_driver"
name = "Studio Super Active Inverse Pre-Conditioner"
description = "Inverse pre-conditioner for Studio Super (default Peggy Classic + Vintage Peggy 8x10 + Dynamic 421 Cone On-Axis; overridable per voicing via preamp_bands)"
input_impedance_meg = 1.0
input_capacitance_pf = 400.0
output_impedance_ohm = 100.0
gain_db = 0.0
bands = [
    { id = "svt_sub_anchor", type = "bell", freq_hz = 56.0, gain_db = 2.8, q = 1.3 },
    { id = "svt_85hz_tame", type = "bell", freq_hz = 84.0, gain_db = -2.4, q = 2.0 },
    { id = "svt_mid_body", type = "bell", freq_hz = 340.0, gain_db = 5.2, q = 0.85 },
    { id = "svt_pocket_lift", type = "bell", freq_hz = 960.0, gain_db = 5.4, q = 1.0 },
    { id = "svt_bite_drive", type = "bell", freq_hz = 1950.0, gain_db = 5.8, q = 1.05 }
]

