bands = [
    { id = "bass", type = "low_shelf", freq_hz = 40.0, gain_db = 2.0 },
    { id = "mid", type = "bell", freq_hz = 800.0, gain_db = -2.0, q = 1.2 },
    { id = "treble", type = "high_shelf", freq_hz = 6500.0, gain_db = 2.0 }
]

