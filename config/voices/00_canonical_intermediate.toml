# ==============================================================================
# 00. CANONICAL INTERMEDIATE (Architecture C Universal Passive Reference Baseline)
# ==============================================================================
# Universal reference baseline representing a clean, wideband passive pickup
# at the 93.5mm datum on a 34" standard scale (fr = 4.8 kHz, Q = 0.75).
# Eliminates unphysical +40 dB ultrasonic deconvolution boosts and Wiener clamping.
# ==============================================================================

id = "00_canonical_intermediate"
name = "00. Canonical Intermediate Baseline"
tone_name = "Canonical Datum"
topology = "Universal Passive Reference Baseline"
description = "Canonical 34-inch 93.5mm acoustic aperture with wideband passive reference circuit (4.8 kHz, Q=0.75)"
scale = "34in"
magnet_type = "ideal"
target_string = "roundwound_nickel_6string"
fr = 4800.0
Q = 0.75
gain_db = 0.0
alpha = 0.0
vsat = 10.0

coils = [
    { strings = ["all"], position_from_bridge_m = 0.0935, aperture_width_in = 0.75, weight = 1.0, pole_type = "rod" }
]

[circuit]
topology = "single"
L = 3.2
Rdc = 6500.0
Reddy = 150000.0
Ccoil = 9e-11
active = false
preamp = "none"
R_out = 50.0
no_eq = false
Rvol = 500000.0
Rtone = 500000.0
Ctone = 4.7e-08
Ccable = 3.3e-10
