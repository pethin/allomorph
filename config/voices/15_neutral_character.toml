# ==============================================================================
# 15. NEUTRAL CHARACTER (Dynamic Studio DI / Tier Feel Bypass)
# ==============================================================================
# Preserves physical pickup aperture and imparts only the character of the
# selected tier (Clean, Dynamic, Hot Rod).
# - In 2-block mode: User disables Block 1 IR; Block 2 adds only tier dynamics.
# - In 1-block mode: In Clean tier, acts as bit-exact 0.00 dB bypass; in Dynamic
#   tier, adds organic Alnico V compliance, hysteresis, sag, and drag.
# ==============================================================================

id = "15_neutral_character"
name = "15. Neutral Character"
tone_name = "Studio Direct"
topology = "Character (Neutral / Studio DI)"
description = "Preserves physical pickup aperture and adds only tier character (transparent bypass in Clean, organic Alnico V feel in Dynamic, overwound punch in Hot Rod)"
blend_mode = "direct"
magnet_type = "alnico_v"
alpha = 0.26
alpha3 = 0.10
eta_hyst = 0.06
k_sag = 0.08
vsat = 0.50
k_eddy = 0.16
kappa_orbit = 0.06
k_body = 0.08
beta_curv = 0.035
k_pull = 0.040
tau_touch = 0.045
chi_mu = 0.035
k_dist = 0.18
kappa_geom = 0.20
k_stein = 0.030
k_emf = 0.04
lambda_L = 0.05
fr = 2500.0
Q = 1.4
sensor_type = "direct"
gain_db = 0.0
scale = "34in"
preserve_aperture = true
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0935, aperture_width_in = 0.75, weight = 1.0 }
]

[circuit]
topology = "single"
L = 4.8
Rdc = 9500.0
Reddy = 110000.0
Ccoil = 8e-11
active = true
preamp = "none"
R_out = 50.0
no_eq = true
Rvol = 500000.0
