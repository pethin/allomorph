# ==============================================================================
# 15c. PASSIVE CHARACTER (High-Impedance Passive Pickup & Cable Loading)
# ==============================================================================
# Adds high-impedance passive character (RLC resonant peak ~2.8 kHz, 750pF cable
# capacitance loading, 250k pot damping) to active basses. Can also be used on
# passive basses to stack vintage warmth and rolled-off highs.
# Preserves physical pickup aperture while stacking with tier dynamics.
# ==============================================================================

id = "15c_passive_character"
name = "15c. Passive Character"
tone_name = "Studio Passive"
topology = "Character (Passive Pickup & Cable Loading)"
description = "Adds high-impedance passive character, resonant peak (~2.8 kHz), 750pF cable loading, and 250k pot damping to active basses or stacks passive tone; preserves natural pickup aperture while stacking with tier dynamics"
blend_mode = "direct"
magnet_type = "alnico_v"
alpha = 0.28
alpha3 = 0.12
eta_hyst = 0.07
k_sag = 0.09
vsat = 0.50
k_eddy = 0.18
kappa_orbit = 0.07
k_body = 0.08
beta_curv = 0.038
k_pull = 0.045
tau_touch = 0.050
chi_mu = 0.040
k_dist = 0.20
kappa_geom = 0.22
k_stein = 0.035
k_emf = 0.05
lambda_L = 0.06
fr = 2800.0
Q = 1.4
gain_db = 0.0
scale = "34in"
preserve_aperture = true
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0935, aperture_width_in = 0.75, weight = 1.0 }
]

[circuit]
topology = "single"
L = 4.2
Rdc = 8500.0
Reddy = 120000.0
Ccoil = 8e-11
vsat = 0.50
Rtop = 10.0
Rbot = 250000.0
Rtone = 250000.0
Ctone = 4.7e-8
