# ------------------------------------------------------------------------------
# 14. UPRIGHT ACOUSTIC BRIDGE TRANSDUCER
# ------------------------------------------------------------------------------
# Models a direct bridge force sensor (Underwood / David Gage Realist style) on
# a 41.5" 3/4 upright scale. Incorporates spatial comb-filter deconvolution,
# velocity-to-force leaky integration (-6 dB/oct), high-tension wave-speed scaling,
# dynamic soft-knee bridge compliance, and 100M-Ohm buffer with 15nF rumble cap.
# Recommended downstream cabinet IR: 3 Sigma Audio Upright Bass AST IRs (specifically the 'Acoustic Upright Standard' folder with the AST file tag).
id = "14_upright_bridge_transducer"
name = "14. Upright Acoustic Bridge Transducer"
tone_name = "Upright Acoustic"
topology = "Acoustic Bridge Transducer"
sensor_type = "bridge_force"
description = "Direct bridge force transducer with 100M-Ohm buffer, 15nF rumble cap, and velocity-to-force leaky integration (recommended with 3 Sigma AST IRs)"
magnet_type = "piezo"
alpha = 0.00
fr = 4500.0
Q = 0.7
gain_db = 0.0
scale = "upright"
target_string = "double_bass_spirocore"
hpf = 30.0
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0050, aperture_width_in = 0.25, weight = 1.0 }
]

[circuit]
topology = "single"
L = 1e-06
Rdc = 50.0
Reddy = 1000000.0
Ccoil = 1.2e-09
vsat = 0.42
Rtop = 10.0
Rbot = 100000000.0
Crick = 1.5000000000000002e-08
Ctb = 0.0
Rtb_par = 100000000.0
Rtb_ser = 100000000.0
