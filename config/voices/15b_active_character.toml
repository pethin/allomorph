# ==============================================================================
# 15b. ACTIVE CHARACTER (Modern Active Buffer)
# ==============================================================================
# Removes passive cable capacitance (750pF) and potentiometer loading from passive
# basses, restoring wideband hi-fi sparkle, punchy transient headroom, and zero
# cable loading. Can also be used on active basses to provide extra treble air.
# Preserves physical pickup aperture while stacking with tier dynamics.
# ==============================================================================

id = "15b_active_character"
name = "15b. Active Character"
tone_name = "Studio Active"
topology = "Character (Modern Active Buffer)"
description = "Removes passive cable loading (750pF) and pot damping to restore wideband hi-fi sparkle and headroom; preserves natural pickup aperture while stacking with tier dynamics"
blend_mode = "direct"
magnet_type = "active"
alpha = 0.15
alpha3 = 0.00
eta_hyst = 0.00
k_sag = 0.00
vsat = 1.20
k_eddy = 0.00
kappa_orbit = 0.00
k_body = 0.00
beta_curv = 0.000
k_pull = 0.000
tau_touch = 0.000
chi_mu = 0.000
k_dist = 0.00
kappa_geom = 0.00
k_stein = 0.000
k_emf = 0.00
lambda_L = 0.00
fr = 5200.0
Q = 1.6
gain_db = 0.0
scale = "34in"
preserve_aperture = true
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0935, aperture_width_in = 0.75, weight = 1.0 }
]

[circuit]
topology = "single"
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11
vsat = 1.2
active = true
preamp = "none"
Rvol = 500000.0
