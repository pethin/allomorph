# ------------------------------------------------------------------------------
# 07. MODERN ACTIVE P/J BASS
# ------------------------------------------------------------------------------
# Compound 3-coil array: Split P-Bass (E/A @ 139.0mm, D/G @ 111.0mm) combined
# with a single-coil Jazz bridge pickup (63.5mm) with onboard active 2-band buffer
# (+4.0 dB @ 40 Hz, +4.0 dB @ 4 kHz) and cable isolation (Sadowsky / Spector style).
id = "07_modern_pj_active"
name = "07. Modern Active P/J Bass"
tone_name = "PJ Active"
topology = "P/J Active Buffer"
description = "Split P-neck and single-coil J-bridge with active 2-band boost (+4.0 dB @ 40 Hz, +4.0 dB @ 4 kHz) and cable isolation"
blend_mode = "parallel"
magnet_type = "ceramic"
alpha = 0.12
fr = 4600.0  # High resonant peak due to zero cable capacitive loading on coils
Q = 1.6
gain_db = 1.5
scale = "34in"
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 0.5 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 0.5 },
    { strings = ["all"],    position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.5 }
]


[circuit]
topology = "parallel"
active = true
preamp = "sadowsky_2band"
Rvol = 500000.0

[circuit.neck]
L = 4.8
Rdc = 9500.0
Reddy = 110000.0
Ccoil = 8e-11
vsat = 0.4

[circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6

[[pickups]]
name = "Modern Ceramic Split-Coil (Neck)"
type = "split_coil"
magnet_type = "ceramic"
alpha = 0.12
fr = 4800.0
Q = 1.7
weight = 0.5
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

[[pickups]]
name = "Modern Ceramic Single-Coil (Bridge)"
type = "single_coil"
magnet_type = "ceramic"
alpha = 0.12
fr = 4600.0
Q = 1.8
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]
