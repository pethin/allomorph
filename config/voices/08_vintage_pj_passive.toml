# ------------------------------------------------------------------------------
# 08. VINTAGE '80S PASSIVE P/J BASS
# ------------------------------------------------------------------------------
# Compound 3-coil array: Vintage '62 Alnico V Split-P (E/A @ 139.0mm, D/G @ 111.0mm)
# combined with vintage 60s Alnico V single-coil Jazz bridge (63.5mm) in parallel,
# loaded with authentic dual 250k volume pots (125k net load) and 250k tone pot.
id = "08_vintage_pj_passive"
name = "08. Vintage '80s Passive P/J Bass"
tone_name = "PJ Passive"
topology = "P/J Parallel Sum"
description = "Vintage Alnico V Split-P neck and single-coil J-bridge summed in parallel with 125k net vol load"
blend_mode = "parallel"
magnet_type = "alnico_v"
alpha = 0.26
fr = 2800.0  # Loaded resonant peak under 125k net pot + cable load
Q = 1.2      # Damped quality factor under dual 250k volume load
gain_db = 0.5
scale = "34in"
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 0.5 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 0.5 },
    { strings = ["all"],    position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.5 }
]


[circuit]
topology = "parallel"
Rtop = 10.0
Rbot = 125000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08

[circuit.neck]
L = 3.8
Rdc = 10500.0
Reddy = 180000.0
Ccoil = 6e-11
vsat = 0.4

[circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6

[[pickups]]
name = "Vintage '62 Alnico Split-Coil (Neck)"
type = "split_coil"
magnet_type = "alnico_v"
alpha = 0.26
fr = 2600.0
Q = 1.3
weight = 0.5
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

[[pickups]]
name = "Vintage 60s Alnico Single-Coil (Bridge)"
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.28
fr = 2800.0
Q = 1.3
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]
