# ------------------------------------------------------------------------------
# 11. MODERN ACTIVE P/MM BASS
# ------------------------------------------------------------------------------
# Compound 4-coil array: Precision Split-P neck (E/A @ 139.0mm, D/G @ 111.0mm) combined
# with an authentic Music Man dual-coil bridge humbucker in parallel (66.0mm datum)
# with an active high-impedance buffer isolating coils from cable capacitance
# (Sandberg California VM / Lakland 44-02 / Delano archetype).
id = "11_modern_pmm_active"
name = "11. Modern Active P/MM Bass (Parallel)"
tone_name = "P∕MM Parallel"
topology = "P/MM Parallel Active Buffer"
description = "Split P-neck and MM parallel humbucker with active high-Z buffer, zero cable drag, and punchy modern slap growl"
blend_mode = "parallel"
magnet_type = "alnico_v"
alpha = 0.22
fr = 3400.0  # High resonant peak due to active buffer cable isolation
Q = 1.55
gain_db = 1.0
scale = "34in"
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 0.5 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.0755, aperture_width_in = 0.75, weight = 0.25 },
    { strings = ["all"], position_from_bridge_m = 0.0565, aperture_width_in = 0.75, weight = 0.25 }
]


[circuit]
topology = "parallel"
active = true
preamp = "none"
preamp_gain = 1.5
Rvol = 500000.0

[circuit.neck]
L = 4.8
Rdc = 9500.0
Reddy = 110000.0
Ccoil = 8e-11
vsat = 0.4

[circuit.bridge]
L = 3.6
Rdc = 7400.0
Reddy = 125000.0
Ccoil = 1.1e-10
vsat = 0.55

[[pickups]]
name = "Precision Split-Coil (Neck)"
type = "split_coil"
magnet_type = "alnico_v"
alpha = 0.26
fr = 3200.0
Q = 1.6
weight = 0.5
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

[[pickups]]
name = "Music Man Dual-Coil Parallel (Bridge)"
type = "dual_coil_parallel"
magnet_type = "alnico_v"
alpha = 0.20
fr = 3500.0
Q = 1.5
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0755, aperture_width_in = 0.75, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.0565, aperture_width_in = 0.75, weight = 0.5 }
]
