# ------------------------------------------------------------------------------
# 02c. JAZZ BASS BRIDGE GROWL (JACO BIAS: BRIDGE 100%, NECK 75%)
# ------------------------------------------------------------------------------
# Classic Jaco Pastorius / Marcus Miller bridge-biased setting: Bridge volume at 100%,
# Neck volume rolled down to 75% introducing 55k wiper decoupling resistance.
# Pulls the acoustic comb notch into the 550-800 Hz range and shifts the resonant peak
# to 3.4 kHz for signature vocal midrange "burp" and growl.
id = "02c_jazz_bridge_growl_bias"
name = "02c. Jazz Bass Bridge Growl (Jaco Bias)"
tone_name = "Jazz Bridge Growl"
topology = "Dual Single-Coil Parallel (Bridge Biased)"
description = "Bridge-biased Jazz pair (Bridge 100%, Neck 75%) with 55k pot decoupling for signature Jaco vocal growl"
blend_mode = "parallel"
magnet_type = "alnico_v"
alpha = 0.28
fr = 3400.0
Q = 1.5
gain_db = -1.2
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 0.35 }, # Decoupled Neck (75% vol)
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.65 }  # Dominant Bridge (100% vol)
]


[circuit]
topology = "parallel"
Rtop = 10.0
Rbot = 109000.0
Rtone = 250000.0
Ctone = 4.7000000000000004e-08
Rpot_n = 55000.0
Rpot_b = 0.0

[circuit.neck]
L = 3.2
Rdc = 7200.0
Reddy = 135000.0
Ccoil = 7e-11
vsat = 0.4

[circuit.bridge]
L = 3.6
Rdc = 7800.0
Reddy = 125000.0
Ccoil = 7e-11
vsat = 0.6

[[pickups]]
name = "Jazz Single-Coil (Neck @ 75%)"
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.25
fr = 3600.0
Q = 1.5
weight = 0.35
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 1.0 }
]

[[pickups]]
name = "60s Jazz Single-Coil (Bridge @ 100%)"
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.28
fr = 3200.0
Q = 1.6
weight = 0.65
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]
