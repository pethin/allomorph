# ------------------------------------------------------------------------------
# 11b. MODERN ACTIVE P/MM BASS (SERIES)
# ------------------------------------------------------------------------------
# Compound 4-coil array: Precision Split-P neck (E/A @ 139.0mm, D/G @ 111.0mm) combined
# with an authentic Music Man dual-coil bridge humbucker in series before the active
# high-impedance buffer stage isolating coils from cable capacitance
# (Sandberg California VM / Lakland 44-02 / Delano archetype in series mode).
id = "11b_pmm_hybrid_series"
name = "11b. Modern Active P/MM Bass (Series)"
tone_name = "P∕MM Series"
topology = "P/MM Series Active Buffer"
description = "Split P-neck and MM parallel humbucker wired in series before active buffer, zero cable drag, and commanding series punch"
blend_mode = "series"
magnet_type = "alnico_v"
alpha = 0.22
fr = 3200.0
Q = 1.6
gain_db = 5.8
scale = "34in"
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 0.5 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.0755, aperture_width_in = 0.75, weight = 0.25 },
    { strings = ["all"], position_from_bridge_m = 0.0565, aperture_width_in = 0.75, weight = 0.25 }
]


[circuit]
topology = "series"
active = true
preamp = "none"
preamp_gain = 1.5
Rvol = 500000.0

[circuit.neck]
L = 4.8
Rdc = 9500.0
Reddy = 110000.0
Ccoil = 8e-11
vsat = 0.4

[circuit.bridge]
L = 3.6
Rdc = 7400.0
Reddy = 125000.0
Ccoil = 1.1e-10
vsat = 0.55

[[pickups]]
name = "Precision Split-Coil (Neck)"
type = "split_coil"
magnet_type = "alnico_v"
alpha = 0.26
fr = 3200.0
Q = 1.6
weight = 0.5
coils = [
    { strings = [3, 4], position_from_bridge_m = 0.1390, aperture_width_in = 1.00, weight = 1.0 },
    { strings = [1, 2], position_from_bridge_m = 0.1110, aperture_width_in = 1.00, weight = 1.0 }
]

[[pickups]]
name = "Music Man Dual-Coil Parallel (Bridge)"
type = "dual_coil_parallel"
magnet_type = "alnico_v"
alpha = 0.20
fr = 3500.0
Q = 1.5
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0755, aperture_width_in = 0.75, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.0565, aperture_width_in = 0.75, weight = 0.5 }
]
