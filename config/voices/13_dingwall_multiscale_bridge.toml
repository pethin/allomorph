# ------------------------------------------------------------------------------
# 13. DINGWALL FANNED-FRET BRIDGE (MULTI-SCALE)
# ------------------------------------------------------------------------------
# Dual-coil humbucker mounted at the angled bridge sweet spot (48.0mm datum)
# on a 34"-37" multi-scale bass, combined with stainless steel string mechanics and 500k pots.
id = "13_dingwall_multiscale_bridge"
name = "13. Dingwall Fanned-Fret Bridge (Multi-Scale)"
tone_name = "Dingwall Bridge"
topology = "Multi-Scale Angled Dual-Coil Active Buffer"
description = "34\"-37\" fanned fret bridge sweet spot with high wave-speed stainless string physics and active buffer"
magnet_type = "neodymium"
alpha = 0.08
fr = 3400.0
Q = 1.5
gain_db = 0.0
scale = "multiscale"
target_string = "roundwound_stainless_clank"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0575, aperture_width_in = 0.75, weight = 0.5 }, # Neck coil
    { strings = ["all"], position_from_bridge_m = 0.0385, aperture_width_in = 0.75, weight = 0.5 }  # Bridge coil
]

[circuit]
topology = "single"
L = 2.3
Rdc = 4400.0
Reddy = 150000.0
Ccoil = 1.2e-10
vsat = 0.9
active = true
preamp = "none"
Rvol = 500000.0
