# ------------------------------------------------------------------------------
# 34"-37" Multi-Scale / Fanned Fret (e.g. Dingwall NG2/NG3, Combustion 5-String)
# Character: 37" low B string produces massive tension, piano-like clarity,
# and percussive metallic clank (3.2 kHz) with zero low-end mud.
# Wave speeds evaluated across the 5-string fanned-fret register (37" B0 -> 34" G2).
# ------------------------------------------------------------------------------
[scales.multiscale]
name = "34\"-37\" Multi-Scale (Fanned Fret)"
scale_length_in = 37.0
scale_length_m = 0.9398
scale_min_in = 34.0
scale_max_in = 37.0
is_multiscale = true
string_wave_speeds = [58.02, 75.88, 99.19, 129.60, 169.27]

