id = "34in_active_stingray"
instrument = "34in_active_stingray"
name = "Active StingRay Bass Tone Pack"
description = "Universal target voicings for 34\" Active Music Man StingRay Bass"
version = 1

storefront_description = """
ALLOMORPH: ACTIVE STINGRAY BASS EDITION

Transform your active Music Man StingRay (4 or 5-string) or Sterling Ray34/Ray35/Ray4/Ray5 bass into 25 legendary vintage passive, modern active, progressive rock, and acoustic pickup configurations.


OVERVIEW

Allomorph turns your active Music Man StingRay into a versatile tonal chameleon. Instead of modeling an amplifier or speaker cabinet, Allomorph sits at the very beginning of your signal chain (Block 1 on the Darkglass Anagram) to reshape the actual sound, pickup response, and feel of your instrument.

The StingRay's bridge humbucker is famous for its punch, hollow mid-scoop, and metallic slap clank, but sometimes a gig calls for the warm, woody body of a neck split-coil, the wide-scoop of dual single-coils, or the dark thump of an upright. Allomorph bridges that gap, giving your StingRay:
• Classic Precision Bass warmth, woody low-mids, and Motown flatwound thump
• The iconic scoop of vintage '60s Jazz Basses and singing Jaco bridge growl
• Modern active slap preamps, boutique P/MM hybrids, and cutting progressive rock clank
• Warm vintage passive dynamics with organic tube-amp feel, replacing sterile active highs
• Acoustic upright double bass resonance for jazz and acoustic sessions
• Aggressive in-your-face series humbucker bark

Calibrated for 4 and 5-string 34" Standard Scale Active Music Man StingRay basses (USA StingRay 4/5, StingRay Special, or Sterling Ray34 / Ray35 / Ray4 / Ray5 / SUB) equipped with the iconic bridge sweet-spot dual-coil humbucker and onboard active preamp. Full wave-speed modeling down to 30.87 Hz ensures seamless calibration across both 4 and 5-string instruments (down to low B). Plug in, select a model, and hear your StingRay transform into a completely different instrument in real time with zero latency.


RECOMMENDED SIGNAL CHAIN

[Active StingRay Bass]
  -> [Block 1: Allomorph Pickup Twin] (Input / Pickup Front-End)
  -> [Block 2: Amp / Drive / Preamp]  (Darkglass B7K, SVT, B-15, etc.)
  -> [Block 3: Speaker Cabinet IR]    (8x10, 4x10, 1x15, etc.)
  -> [FOH / Audio Interface / DAW]

Why Block 1? Overdrive pedals and amps react directly to the resonant character of your pickups. Putting Allomorph first ensures downstream pedals and amp models distort the authentic growl of a P-bass split-coil, the scoop of a Jazz pair, or vintage tube-friendly passive dynamics, rather than an unshaped active DI.


QUICK INSTRUMENT SETUP

• 3-Way Mode Switch (if equipped on 5-string / Ray35): Set to Parallel (Position 1 / toward bridge)
• Onboard Active EQ (Bass, Treble, Mid): Set to Center Detents (Flat / 0 dB)

Start with your switch in parallel and active EQ flat for the calibrated baseline—all pickup positioning, pot loading, tone capacitor shaping, and active preamp EQs are handled automatically by the models. From there, feel free to tweak your onboard controls and EQ to shape the tone to taste.


THE 25 DIGITAL TWIN VOICINGS


Precision Bass & Super P Family

01. Precision Vintage
Vintage '62 Precision Bass: warm, woody low-mids, open harmonic bloom, and organic touch sensitivity.

02. Precision Active
Active split-coil P-Bass with 18V 3-band preamp: authoritative low-end weight and bright transient punch.

03. Dingwall Super P
Multi-scale passive Neodymium Split-P: fanned-fret low-end tightness with a focused 3 kHz presence peak.

04. Precision Warm
Classic Motown flatwound P-Bass: fat, pillowy sub-bass thump with smooth rolled-off highs.


Jazz Bass Family

05. Jazz Pair Active
NYC '70s active slap tone: tight, massive sub-bass and crisp, glassy highs with a midrange scoop.

06. Jazz Pair Open
Vintage '60s Jazz Bass: hollow midrange scoop, warm low-mids, and smooth, singing top-end.

07. Jazz Pair Series
Series-wired dual Jazz coils: replaces the parallel scoop with hot, muscular humbucking midrange punch.

08. Jazz Bridge Growl
Jaco-style bridge growl: vocal, honky upper-mid bark that retains full low-end body.

09. Jazz Neck Warm
Solo '60s neck single-coil: deep, round, woody low-end bloom with open single-coil clarity.


P/MM Modern Hybrids

10. P∕MM Parallel
Modern active P/MM hybrid: warm Split-P neck blended with a scooped, sparkling parallel Music Man bridge humbucker.

11. P∕MM Series
Active P/MM hybrid in series: punchy, mid-forward humbucker roar and muscular rock authority.


P/J Bass Family

12. PJ Active
Modern active P/J: split-coil body and bridge single-coil cut boosted by an 18V 3-band preamp.

13. PJ Passive
Classic '80s passive P/J: thick hard-rock punch with aggressive midrange bite and low-end grunt.


Rickenbacker 4001/4003 Family

14. Rickenbacker Clank
Classic prog-rock bridge clank: tight, lean lows with biting pick attack and upper-mid grit.

15. Rickenbacker Vintage
Vintage 4001 dual-pickup pair: full-range neck sub-bass combined with high-passed bridge clank.

16. Rickenbacker Neck
Solo 4001/4003 neck single-coil: deep, woody fundamental with glassy roundwound presence.


Dingwall Multi-Scale Family

17. Dingwall Bridge
Modern progressive metal bridge tone: razor-sharp pick clank and piano-like low-B definition.

18. Dingwall Parallel
Multi-scale bridge and middle coils in parallel: scooped aggression, fast transient snap, and tight sub-bass.

19. Dingwall Series
Multi-scale bridge and middle coils in series: massive low-mid wall of sound and modern rock authority.


Gibson Mudbucker & Hollow-Body Family

20. Mudbucker Deep
Solid-body Gibson EB-0 Mudbucker: a dark, colossal wall of vintage sub-bass rumble.

21. Mudbucker Hollow
Semi-hollow EB-2 Mudbucker: massive short-scale low end with warm maple archtop wood bloom and decay.

22. Mudbucker Baritone
Semi-hollow EB-2 with Baritone filter: cuts sub-bass mud to focus a snarling, woody midrange rock bark.

23. Hofner Violin Warm
Hollow-body 500/1 violin bass with flatwounds: explosive woody attack thump and fast, blooming decay.


Acoustic Transducers

24. Upright Piezo
Acoustic upright double bass: woody pizzicato decay and organic finger feel (pair with 3 Sigma Audio Upright AST IRs).


Music Man StingRay Family

25. StingRay Series
Series-wired StingRay: hotter output, punchy low-mids, and an aggressive rock bark.
"""

