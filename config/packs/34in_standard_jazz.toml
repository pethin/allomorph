id = "34in_standard_jazz"
instrument = "34in_standard_jazz"
name = "Standard Jazz Bass Tone Pack"
description = "Universal target voicings for 34\" Standard Jazz Bass"
version = 1

storefront_description = """
ALLOMORPH: STANDARD JAZZ BASS EDITION

Transform your stock Fender Jazz Bass into 25 legendary active, vintage, modern, hollow-body, and acoustic pickup configurations.


OVERVIEW

Allomorph turns your Fender Jazz Bass into a versatile tonal chameleon. Instead of modeling an amplifier or speaker cabinet, Allomorph sits at the very beginning of your signal chain (Block 1 on the Darkglass Anagram) to reshape the actual sound, pickup response, and feel of your instrument.

With this pack, your Jazz Bass can instantly deliver:
• Classic Precision Bass warmth, woody low-mids, and Motown flatwound thump
• The aggressive punch, hollow scoop, and metallic bite of Music Man StingRays
• Modern active slap preamps, boutique P/MM hybrids, and cutting multi-scale progressive rock clank
• Iconic 1960s Hofner hollow-body violin thump and Gibson EB-2 semi-hollow archtop rumble
• Acoustic upright double bass resonance for jazz and acoustic sessions
• '70s bridge-shifted dual-pickup growl, S-1 series humbucking punch, Jaco Pastorius bridge bark, and solo neck warmth

Calibrated specifically for a 34" Standard Jazz Bass with both stock single-coil pickups wide open in parallel (preserving 100% hum cancellation across every model). Plug in, select a model, and hear your Jazz Bass transform into a completely different instrument in real time with zero latency.


RECOMMENDED SIGNAL CHAIN

[Fender Jazz Bass]
  -> [Block 1: Allomorph Pickup Twin] (Input / Pickup Front-End)
  -> [Block 2: Amp / Drive / Preamp]  (Darkglass B7K, SVT, B-15, etc.)
  -> [Block 3: Speaker Cabinet IR]    (8x10, 4x10, 1x15, etc.)
  -> [FOH / Audio Interface / DAW]

Why Block 1? Overdrive pedals and amps react directly to the resonant character of your pickups. Putting Allomorph first ensures downstream pedals and amp models distort the authentic growl of a P-bass split-coil, the clank of a StingRay, or the bite of an active preamp, rather than a generic DI signal.


QUICK INSTRUMENT SETUP

• Neck Volume Knob: 100% (Wide Open)
• Bridge Volume Knob: 100% (Wide Open)
• Master Tone Knob: 100% (Wide Open)

Start with both pickups wide open in parallel for the calibrated baseline—preserving 100% hum cancellation while letting you switch between solo neck, solo bridge, and dual-pickup instruments hands-free via footswitch. From there, feel free to roll back or tweak your onboard controls to shape the tone to taste.


THE 25 DIGITAL TWIN VOICINGS


Precision Bass & Super P Family

01. Precision Vintage
Vintage '62 Precision Bass: warm, woody low-mids, open harmonic bloom, and organic touch sensitivity.

02. Precision Active
Active split-coil P-Bass with 18V 3-band preamp: authoritative low-end weight and bright transient punch.

03. Dingwall Super P
Multi-scale passive Neodymium Split-P: fanned-fret low-end tightness with a focused 3 kHz presence peak.

04. Precision Warm
Classic Motown flatwound P-Bass: fat, pillowy sub-bass thump with smooth rolled-off highs.


Music Man StingRay Family

05. StingRay Parallel
Classic active StingRay: thunderous low end, metallic slap clank, and signature hollow midrange scoop.

06. StingRay Series
Series-wired StingRay: hotter output, punchy low-mids, and an aggressive rock bark.


P/J Bass Family

07. PJ Active
Modern active P/J: split-coil body and bridge single-coil cut boosted by an 18V 3-band preamp.

08. PJ Passive
Classic '80s passive P/J: thick hard-rock punch with aggressive midrange bite and low-end grunt.


P/MM Modern Hybrids

09. P∕MM Parallel
Modern active P/MM hybrid: warm Split-P neck blended with a scooped, sparkling parallel Music Man bridge humbucker.

10. P∕MM Series
Active P/MM hybrid in series: punchy, mid-forward humbucker roar and muscular rock authority.


Rickenbacker 4001/4003 Family

11. Rickenbacker Clank
Classic prog-rock bridge clank: tight, lean lows with biting pick attack and upper-mid grit.

12. Rickenbacker Vintage
Vintage 4001 dual-pickup pair: full-range neck sub-bass combined with high-passed bridge clank.

13. Rickenbacker Neck
Solo 4001/4003 neck single-coil: deep, woody fundamental with glassy roundwound presence.


Dingwall Multi-Scale Family

14. Dingwall Bridge
Modern progressive metal bridge tone: razor-sharp pick clank and piano-like low-B definition.

15. Dingwall Series
Multi-scale bridge and middle coils in series: massive low-mid wall of sound and modern rock authority.

16. Dingwall Parallel
Multi-scale bridge and middle coils in parallel: scooped aggression, fast transient snap, and tight sub-bass.


Gibson Mudbucker & Hollow-Body Family

17. Mudbucker Deep
Solid-body Gibson EB-0 Mudbucker: a dark, colossal wall of vintage sub-bass rumble.

18. Mudbucker Hollow
Semi-hollow EB-2 Mudbucker: massive short-scale low end with warm maple archtop wood bloom and decay.

19. Mudbucker Baritone
Semi-hollow EB-2 with Baritone filter: cuts sub-bass mud to focus a snarling, woody midrange rock bark.

20. Hofner Violin Warm
Hollow-body 500/1 violin bass with flatwounds: explosive woody attack thump and fast, blooming decay.


Acoustic Transducers

21. Upright Piezo
Acoustic upright double bass: woody pizzicato decay and organic finger feel (pair with 3 Sigma Audio Upright AST IRs).


Jazz Bass Family

22. Jazz Pair Active
NYC '70s active slap tone: tight, massive sub-bass and crisp, glassy highs with a midrange scoop.

23. Jazz Pair Series
Series-wired dual Jazz coils: replaces the parallel scoop with hot, muscular humbucking midrange punch.

24. Jazz Bridge Growl
Jaco-style bridge growl: vocal, honky upper-mid bark that retains full low-end body and hum cancellation.

25. Jazz Neck Warm
Solo '60s neck single-coil: deep, round, woody low-end bloom with open single-coil clarity and hum-free operation.
"""

