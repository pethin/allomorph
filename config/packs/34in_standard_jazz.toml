id = "34in_standard_jazz"
instrument = "34in_standard_jazz"
name = "Standard Jazz Bass Tone Pack"
description = "Universal target voicings for 34\" Standard Jazz Bass"
version = 1

storefront_description = """
ALLOMORPH: STANDARD JAZZ BASS EDITION

Transform your stock Fender Jazz Bass into 21 legendary active, vintage, modern, and acoustic pickup configurations.


OVERVIEW

Allomorph turns your Fender Jazz Bass into a versatile tonal chameleon. Instead of modeling an amplifier or speaker cabinet, Allomorph sits at the very beginning of your signal chain (Block 1 on the Darkglass Anagram) to reshape the actual sound, pickup response, and feel of your instrument.

With this pack, your Jazz Bass can instantly deliver:
• Classic Precision Bass warmth, woody low-mids, and Motown flatwound thump
• The aggressive punch, hollow scoop, and metallic bite of Music Man StingRays
• Modern active slap preamps, boutique P/MM hybrids, and cutting progressive rock clank
• Acoustic upright double bass resonance for jazz and acoustic sessions
• Pure studio buffer clarity or organic vintage tube-friendly passive warmth

Calibrated specifically for a 34" Standard Jazz Bass with stock single-coil pickups. Plug in, select a model, and hear your Jazz Bass transform into a completely different instrument in real time with zero latency.


RECOMMENDED SIGNAL CHAIN

[Fender Jazz Bass]
  -> [Block 1: Allomorph Pickup Twin] (Input / Pickup Front-End)
  -> [Block 2: Amp / Drive / Preamp]  (Darkglass B7K, SVT, B-15, etc.)
  -> [Block 3: Speaker Cabinet IR]    (8x10, 4x10, 1x15, etc.)
  -> [FOH / Audio Interface / DAW]

Why Block 1? Overdrive pedals and amps react directly to the resonant character of your pickups. Putting Allomorph first ensures downstream pedals and amp models distort the authentic growl of a P-bass split-coil, the clank of a StingRay, or the bite of an active preamp, rather than a generic DI signal.


QUICK INSTRUMENT SETUP

For each voicing, set your bass's physical pickup controls to the recommended bracketed setting [Parallel], [Neck], or [Bridge]:

• [Parallel]: Neck Vol 100% | Bridge Vol 100% (Both Pickups Wide Open)
• [Neck]: Neck Vol 100% | Bridge Vol 0% (Solo Neck Pickup)
• [Bridge]: Neck Vol 0% | Bridge Vol 100% (Solo Bridge Pickup)
• Master Tone Knob: 100% (Wide Open across all models)

Plug straight in. All pickup positioning, pot loading, tone capacitor shaping, and active preamp EQs are handled automatically by the models.


THE 21 DIGITAL TWIN VOICINGS


Precision Bass & Tone Shaper Family

01. Precision Vintage [Neck]
The gold standard: a vintage 1962 Precision Bass with tone wide open. Warm, woody low-mids, open harmonic bloom, and organic touch sensitivity that sits perfectly in any mix.

02. Precision Active [Neck]
Fender American Ultra II active split-coil P-bass tone with 18V 3-band active preamp. Punchy, articulate, and wideband with authoritative low-end weight and bright transient clarity—built for modern rock, gospel, and mix cutting authority.

03. Precision Mids [Neck]
Vintage P-bass with a modern vocal low-mid punch. Cuts finger clatter and high-end sizzle while keeping a muscular, forward presence in a busy mix.

04. Precision Warm [Neck]
The legendary Motown flatwound sound (James Jamerson / Pino Palladino). Fat, pillowy sub-bass thump with rolled-off highs that glues the groove together.

05. Precision Dub [Neck]
Ultra-deep vintage '50s dub spec. Pure, earth-shaking sub-bass thump with zero top-end click—perfect for reggae, dub, hip-hop, and classic R&B.


Music Man StingRay Family

06. StingRay Parallel [Bridge]
The iconic Music Man StingRay sound: thunderous low end, aggressive metallic slap clank, and that hollow midrange scoop heard on thousands of hit records.

07. StingRay Series [Bridge]
StingRay wired in series for a hotter, thicker signal with punchy low-mids and an aggressive, in-your-face rock bark.


P/J Bass Family

08. PJ Active [Parallel]
Modern active P/J punch (Sadowsky/Spector style). Combines thick split-coil body with bridge single-coil cut, boosted by a powerful active 2-band EQ.

09. PJ Passive [Parallel]
Classic '80s rock P/J tone (Fender Precision Special / Yamaha BB). Thick hard-rock punch with aggressive midrange bite and authoritative low-end grunt.


P/MM Modern Hybrids

10. P∕MM Parallel [Parallel]
Modern boutique session hybrid (Lakland 44-02 / Sandberg California style). Blends the woody warmth of a Split-P neck with the scooped slap bite and sparkling top-end of a parallel Music Man bridge humbucker through an active 3-band preamp.

11. P∕MM Series [Parallel]
Modern active P/MM hybrid with the bridge humbucker switched to series coils. Delivers a punchy, mid-forward humbucker roar and muscular rock authority through the active 3-band preamp.


Progressive & Classic Rock Legends

12. Rickenbacker Clank [Bridge]
The quintessential prog-rock clank (Chris Squire / Geddy Lee). Tight, lean low end with biting, aggressive pick attack and cutting upper-mid grit.

13. Rickenbacker Open [Bridge]
Modern 4003 bridge tone with the vintage capacitor bypassed. Fuller low-end body and punch while retaining that signature biting Rickenbacker top-end cut.

14. Dingwall Bridge [Bridge]
Modern progressive metal tone: razor-sharp pick clank, extreme note clarity, and piano-like low-B definition tailored for drop tunings and heavy distortion.

15. Dingwall Middle [Neck]
FD3 middle pickup solo: focused, aggressive low-mid grunt and punchy growl with exceptional articulation across all registers.

16. Dingwall Parallel [Parallel]
FD3 bridge and middle coils in parallel: modern scooped aggression with ultra-fast transient attack, tight sub-bass, and pristine harmonic sparkle.

17. Mudbucker Deep [Neck]
The legendary Gibson "Mudbucker": a dark, colossal wall of pure vintage bass rumble with zero top-end harshness—pure '60s and '70s British blues-rock.


Acoustic Transducers

18. Upright Piezo [Neck]
Acoustic upright double bass: transforms your electric bass into a woody, resonant acoustic upright with natural body thump and organic finger feel. Pair with 3 Sigma Audio "Acoustic Upright Standard" AST IRs in your cabinet loader for authentic soundboard acoustic bloom.


Jazz Bass Family

19. Jazz Pair Active [Parallel]
The quintessential NYC active slap tone: tight, massive sub-bass and crisp, glassy highs with a scooped midrange that pops right out of a dense mix.

20. Jazz Pair Mids [Parallel]
Jazz Bass pair with a vocal midrange punch. Thickens up your fingerstyle attack and smooths out harsh fret clank while keeping every note articulate.

21. Jazz Bridge Growl [Bridge]
The unmistakable Jaco Pastorius tone: solo your bridge pickup for that signature singing, vocal bridge growl and burp.
"""

