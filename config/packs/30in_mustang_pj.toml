id = "30in_mustang_pj"
instrument = "30in_mustang_pj"
name = "Mustang PJ Bass Tone Pack"
description = "Universal target voicings for 30\" Mustang PJ Bass"
version = 1

storefront_description = """
ALLOMORPH: MUSTANG P/J BASS EDITION

Transform your short-scale Fender Mustang P/J Bass into 26 legendary active, vintage, modern, hollow-body, and acoustic pickup configurations.


OVERVIEW

Allomorph turns your short-scale Fender Mustang P/J Bass into a versatile tonal chameleon. Instead of modeling an amplifier or speaker cabinet, Allomorph sits at the very beginning of your signal chain (Block 1 on the Darkglass Anagram) to reshape the actual sound, pickup response, and feel of your instrument.

Short-scale basses are comfortable and fast to play, but often lack the string tension, low-end authority, and harmonic snap of a full-size 34" bass. Allomorph bridges that gap, giving your Mustang:
• The full, punchy string snap and harmonic bloom of standard 34" P-Basses and '60s/'70s Jazz Basses
• Thunderous Music Man StingRay humbucker punch, hollow slap scoop, and series bark
• Modern active slap preamps, boutique P/MM hybrids, and cutting multi-scale progressive rock clank
• Warm Motown flatwound thump, 1960s Hofner hollow-body violin bass, and Gibson EB-2 semi-hollow rumble
• Acoustic upright double bass resonance for jazz and acoustic sessions
• Pure studio buffer clarity or organic vintage tube-friendly passive warmth

Calibrated specifically for a 30" Short-Scale Fender Mustang P/J Bass with the 3-way toggle in the Middle position (both Split-P neck and single-coil J bridge pickups active in parallel). Plug in, select a model, and hear your short-scale bass deliver full-size 34" authority in real time with zero latency.


RECOMMENDED SIGNAL CHAIN

[Mustang P/J Bass]
  -> [Block 1: Allomorph Pickup Twin] (Input / Pickup Front-End)
  -> [Block 2: Amp / Drive / Preamp]  (Darkglass B7K, SVT, B-15, etc.)
  -> [Block 3: Speaker Cabinet IR]    (8x10, 4x10, 1x15, etc.)
  -> [FOH / Audio Interface / DAW]

Why Block 1? Overdrive pedals and amps react directly to the resonant character of your pickups. Putting Allomorph first ensures downstream pedals and amp models distort the authentic scoop of a Jazz pair, the clank of a StingRay, or the bite of an active preamp, rather than a generic DI signal.


QUICK INSTRUMENT SETUP

• 3-Way Pickup Toggle Switch: Middle Position (Both Pickups Active in Parallel)
• Master Volume Knob: 100% (Wide Open)
• Master Tone Knob: 100% (Wide Open)

Start with your toggle switch in the middle position and knobs wide open for the calibrated baseline—all scale length scaling, pickup positioning, pot loading, and active preamp EQs are handled automatically by the models. From there, feel free to roll back or tweak your onboard controls to shape the tone to taste.


THE 26 DIGITAL TWIN VOICINGS


Jazz Bass Family

01. Jazz Pair Active
NYC '70s active slap tone: tight, massive sub-bass and crisp, glassy highs with a midrange scoop.

02. Jazz Pair Open
Vintage '60s Jazz Bass: full 34" dual single-coil hollow midrange scoop, warm low-mids, and smooth top-end.

03. Jazz Pair Series
Series-wired dual Jazz coils: replaces the parallel scoop with hot, muscular humbucking midrange punch.

04. Jazz Bridge Growl
Jaco-style bridge growl: vocal, honky upper-mid bark that retains full low-end body.

05. Jazz Neck Warm
Solo '60s neck single-coil: deep, round, woody low-end bloom with open single-coil clarity.


Music Man StingRay Family

06. StingRay Parallel
Classic active StingRay: thunderous low end, metallic slap clank, and signature hollow midrange scoop.

07. StingRay Series
Series-wired StingRay: hotter output, punchy low-mids, and an aggressive rock bark.


P/MM Modern Hybrids

08. P∕MM Parallel
Modern active P/MM hybrid: warm Split-P neck blended with a scooped, sparkling parallel Music Man bridge humbucker.

09. P∕MM Series
Active P/MM hybrid in series: punchy, mid-forward humbucker roar and muscular rock authority.


Rickenbacker 4001/4003 Family

10. Rickenbacker Clank
Classic prog-rock bridge clank: tight, lean lows with biting pick attack and upper-mid grit.

11. Rickenbacker Vintage
Vintage 4001 dual-pickup pair: full-range neck sub-bass combined with high-passed bridge clank.

12. Rickenbacker Neck
Solo 4001/4003 neck single-coil: deep, woody fundamental with glassy roundwound presence.


Dingwall Multi-Scale Family

13. Dingwall Bridge
Modern progressive metal bridge tone: razor-sharp pick clank and piano-like low-B definition.

14. Dingwall Series
Multi-scale bridge and middle coils in series: massive low-mid wall of sound and modern rock authority.

15. Dingwall Parallel
Multi-scale bridge and middle coils in parallel: scooped aggression, fast transient snap, and tight sub-bass.


Gibson Mudbucker & Hollow-Body Family

16. Mudbucker Deep
Solid-body Gibson EB-0 Mudbucker: a dark, colossal wall of vintage sub-bass rumble.

17. Mudbucker Hollow
Semi-hollow EB-2 Mudbucker: massive short-scale low end with warm maple archtop wood bloom and decay.

18. Mudbucker Baritone
Semi-hollow EB-2 with Baritone filter: cuts sub-bass mud to focus a snarling, woody midrange rock bark.

19. Hofner Violin Warm
Hollow-body 500/1 violin bass with flatwounds: explosive woody attack thump and fast, blooming decay.


Acoustic Transducers

20. Upright Piezo
Acoustic upright double bass: woody pizzicato decay and organic finger feel (pair with 3 Sigma Audio Upright AST IRs).


Precision Bass & Super P Family

21. Precision Vintage
Vintage '62 Precision Bass: full 34" scale tension, warm woody low-mids, and organic touch sensitivity.

22. Precision Active
Active split-coil P-Bass with 18V 3-band preamp: authoritative low-end weight and bright transient punch.

23. Dingwall Super P
Multi-scale passive Neodymium Split-P: fanned-fret low-end tightness with a focused 3 kHz presence peak.

24. Precision Warm
Classic Motown flatwound P-Bass: fat, pillowy sub-bass thump with smooth rolled-off highs.


P/J Bass Family

25. PJ Active
Modern active P/J: split-coil body and bridge single-coil cut boosted by an 18V 3-band preamp.

26. PJ Passive
Classic '80s passive P/J: thick hard-rock punch with aggressive midrange bite and low-end grunt.
"""

