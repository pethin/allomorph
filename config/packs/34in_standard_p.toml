name = "Standard P-Bass Tone Pack"
description = "Universal vintage and modern target voicings for 34\" Standard Precision Bass"
version = 1

storefront_description = """
ALLOMORPH: STANDARD PRECISION BASS EDITION

Transform your stock Fender P-Bass into 35 legendary active, vintage, modern, hollow-body, acoustic, and rig-calibrated Studio Super pickup configurations.


OVERVIEW

Allomorph turns your Fender Precision Bass into a versatile tonal chameleon. Instead of modeling an amplifier or speaker cabinet, Allomorph sits at the very beginning of your signal chain (Block 1 on the Darkglass Anagram) to reshape the actual sound, pickup response, and feel of your instrument.

With this pack, your single P-Bass can instantly deliver:
• The iconic scoop of vintage '60s and '70s Jazz Basses, series humbucking punch, and aggressive Music Man StingRays
• Modern active slap preamps, boutique P/MM hybrids, and cutting multi-scale progressive rock clank
• Warm Motown flatwound thump, woody 1960s Hofner hollow-body violin bass, and semi-hollow Gibson EB-2 rumble
• Acoustic upright double bass resonance for jazz and acoustic sessions
• 10 Studio Super tones that pre-shape your bass in Block 1 for specific Darkglass Anagram amp and cab combos so the full rig sits mix-ready with zero extra EQ

Calibrated specifically for a 34" Standard Precision Bass with stock split-coil pickups. Plug in, select a model, and hear your P-Bass transform into a completely different instrument in real time with zero latency.


RECOMMENDED SIGNAL CHAIN

[Fender P-Bass]
  -> [Block 1: Allomorph Pickup Twin] (Input / Pickup Front-End)
  -> [Block 2: Amp / Drive / Preamp]  (Darkglass B7K, SVT, B-15, etc.)
  -> [Block 3: Speaker Cabinet IR]    (8x10, 4x10, 1x15, etc.)
  -> [FOH / Audio Interface / DAW]

Why Block 1? Overdrive pedals and amps react directly to the resonant character of your pickups. Putting Allomorph first ensures downstream pedals and amp models distort the authentic growl of a Jazz bridge pickup, the clank of a StingRay, or the scoop of dual single-coils, rather than a generic DI signal.


QUICK INSTRUMENT SETUP

• Physical Volume Knob: 100% (Wide Open)
• Physical Tone Knob: 100% (Wide Open)

Start with your knobs wide open for the calibrated baseline—all pickup positioning, pot loading, tone capacitor shaping, and active preamp EQs are handled automatically by the models. From there, feel free to roll back or tweak your onboard controls to shape the tone to taste.


THE 35 DIGITAL TWIN VOICINGS


Jazz Bass Family

01. Jazz Pair Active
NYC '70s active slap tone: tight, massive sub-bass and crisp, glassy highs with a midrange scoop.

02. Jazz Pair Open
Vintage '60s Jazz Bass: hollow midrange scoop, warm low-mids, and smooth, singing top-end.

03. Jazz Pair Series
Series-wired dual Jazz coils: replaces the parallel scoop with hot, muscular humbucking midrange punch.

04. Jazz Bridge Growl
Jaco-style bridge growl: vocal, honky upper-mid bark that retains full low-end body.

05. Jazz Neck Warm
Solo '60s neck single-coil: deep, round, woody low-end bloom with open single-coil clarity.


Music Man StingRay Family

06. StingRay Parallel
Classic active StingRay: thunderous low end, metallic slap clank, and signature hollow midrange scoop.

07. StingRay Series
Series-wired StingRay: hotter output, punchy low-mids, and an aggressive rock bark.


P/J Bass Family

08. PJ Active
Modern active P/J: split-coil body and bridge single-coil cut boosted by an 18V 3-band preamp.

09. PJ Passive
Classic '80s passive P/J: thick hard-rock punch with aggressive midrange bite and low-end grunt.


P/MM Modern Hybrids

10. P∕MM Parallel
Modern active P/MM hybrid: warm Split-P neck blended with a scooped, sparkling parallel Music Man bridge humbucker.

11. P∕MM Series
Active P/MM hybrid in series: punchy, mid-forward humbucker roar and muscular rock authority.


Rickenbacker 4001/4003 Family

12. Rickenbacker Clank
Classic prog-rock bridge clank: tight, lean lows with biting pick attack and upper-mid grit.

13. Rickenbacker Vintage
Vintage 4001 dual-pickup pair: full-range neck sub-bass combined with high-passed bridge clank.

14. Rickenbacker Neck
Solo 4001/4003 neck single-coil: deep, woody fundamental with glassy roundwound presence.


Dingwall Multi-Scale Family

15. Dingwall Bridge
Modern progressive metal bridge tone: razor-sharp pick clank and piano-like low-B definition.

16. Dingwall Series
Multi-scale bridge and middle coils in series: massive low-mid wall of sound and modern rock authority.

17. Dingwall Parallel
Multi-scale bridge and middle coils in parallel: scooped aggression, fast transient snap, and tight sub-bass.


Gibson Mudbucker & Hollow-Body Family

18. Mudbucker Deep
Solid-body Gibson EB-0 Mudbucker: a dark, colossal wall of vintage sub-bass rumble.

19. Mudbucker Hollow
Semi-hollow EB-2 Mudbucker: massive short-scale low end with warm maple archtop wood bloom and decay.

20. Mudbucker Baritone
Semi-hollow EB-2 with Baritone filter: cuts sub-bass mud to focus a snarling, woody midrange rock bark.

21. Hofner Violin Warm
Hollow-body 500/1 violin bass with flatwounds: explosive woody attack thump and fast, blooming decay.


Acoustic Transducers

22. Upright Piezo
Acoustic upright double bass: woody pizzicato decay and organic finger feel (pair with 3 Sigma Audio Upright AST IRs).


Precision Bass & Super P Family

23. Precision Active
Active split-coil P-Bass with 18V 3-band preamp: authoritative low-end weight and bright transient punch.

24. Dingwall Super P
Multi-scale passive Neodymium Split-P: fanned-fret low-end tightness with a focused 3 kHz presence peak.

25. Precision Warm
Classic Motown flatwound P-Bass: fat, pillowy sub-bass thump with smooth rolled-off highs.


Studio Super Family (Requires Matching Anagram Amp & Cab Blocks)
Instead of emulating a historic bass in isolation, each Studio Super tone pre-shapes your instrument in Block 1 for a specific Darkglass Anagram amp and cabinet pairing—taming cabinet sub-boom, filling amp mid-scoops, and smoothing harsh speaker/mic peaks so the full rig sits record-ready in the mix at 100% wet with zero extra EQ. These models do not include the amplifier or cabinet; load the listed Anagram Amp and Cab blocks after Block 1 to complete the chain.

26. Studio Super SVT Classic
Classic and modern rock studio front-end with tight lows and authoritative midrange growl (requires Anagram blocks: Peggy Classic + Vintage Peggy 8x10 + Dynamic 421 Cone On-Axis).

27. Studio Super SVT Blueline
Aggressive pick-rock and punk front-end with forward upper-mid grind and tamed cone fizz (requires Anagram blocks: Peggy Bass + Peggy 8x10 + Dynamic 421 Cap Off-Axis).

28. Studio Super B15
Warm Motown and soul front-end with pillowy sub-bass and smooth fingerstyle articulation (requires Anagram blocks: Peggy FlipTop + Peggy Fliptop 1x15 + Condenser 67 Cone On-Axis).

29. Studio Super Bassman
Classic rock, indie, and blues front-end with warm midrange body and articulate top-end snap (requires Anagram blocks: Super California + California Bass 4x10 + Condenser 67 Cone On-Axis).

30. Studio Super GK 800RB
Punchy '80s/'90s alt-rock and funk front-end with tight lows and snappy upper-mid presence (requires Anagram blocks: Kallinen Kruukkeri + SWIRL 4x10 + Dynamic 421 Cone On-Axis).

31. Studio Super Mesa Block
Modern hard-rock and metal front-end with tightened sub-bass and aggressive pick clank (requires Anagram blocks: Modern ISOBRICK750 OD + Modern Bass 4x10 + Dynamic 421 Cone On-Axis).

32. Studio Super Orange
Thick stoner, doom, and indie front-end with creamy British midrange roar and smooth highs (requires Anagram blocks: Fruity Horror Bass 500 + Fruity Bass 4x10 + Dynamic 7 Cone On-Axis).

33. Studio Super SWR Goliath
Hi-fi '90s slap and fusion front-end with extended lows, supportive mids, and crisp slap snap (requires Anagram blocks: Swirl-900 + SWIRL 4x10 + Condenser 103 Cap Off-Axis).

34. Studio Super Markbass
Articulate jazz, fusion, and pop/funk front-end with clean low-mids and vocal midrange clarity (requires Anagram blocks: Black and Yellow + Black & Yellow 4x10 + Condenser 414 Cap Off-Axis).

35. Studio Super EBS TD650
Tight Scandinavian metal and prog front-end with low-mid authority and razor-sharp attack (requires Anagram blocks: SWE TC650 + Darkglass Neo 4x10 + Dynamic 7 Cap Off-Axis).
"""

