[project]
name = "allomorph"
version = "0.3.0"
description = "Analog digital twin & universal pickup/transducer modeling engine"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.14"
dependencies = [
    "polars>=1.20.0",
    "altair>=5.5.0",
    "pedalboard>=0.9.0",
    "neural-amp-modeler>=0.13.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "numba>=0.67.0",
    "torch>=2.1.0",
]

[project.optional-dependencies]
rocm = [
    "rocm; sys_platform == 'win32' or sys_platform == 'linux'",
    "rocm-sdk-core; sys_platform == 'win32' or sys_platform == 'linux'",
    "rocm-sdk-libraries; sys_platform == 'win32' or sys_platform == 'linux'",
    "rocm-sdk-device-gfx1201; sys_platform == 'win32' or sys_platform == 'linux'",
    "amd-torch-device-gfx12-0; sys_platform == 'win32' or sys_platform == 'linux'",
    "amd-torch-device-gfx1201; sys_platform == 'win32' or sys_platform == 'linux'",
    "triton; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
allomorph = "allomorph.cli:main"
allomorph-sim = "allomorph.circuit:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyrefly]
preset = "strict"
project-includes = [
    "**/*.py*",
]
search-path = ["src", "scripts"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "amd-rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "amd-rocm", marker = "extra == 'rocm' and (sys_platform == 'win32' or sys_platform == 'linux')" },
]
amd-torch-device-gfx12-0 = [
    { index = "amd-rocm", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
amd-torch-device-gfx1201 = [
    { index = "amd-rocm", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
rocm = [
    { index = "amd-rocm", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
rocm-sdk-core = [
    { index = "amd-rocm", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
rocm-sdk-libraries = [
    { index = "amd-rocm", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1201 = [
    { index = "amd-rocm", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
triton = [
    { index = "amd-rocm", marker = "sys_platform == 'linux'" },
]


